<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orchid check</title>
<style>body{font:15px/1.5 system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;color:#0b1b34}h1{font-size:1.3rem}button{font:inherit;font-weight:700;padding:10px 18px;border-radius:99px;border:0;background:#0176d3;color:#fff;cursor:pointer;margin:0 8px 8px 0}button.g{background:#fff;color:#0b1b34;border:1px solid #cbd5e1}pre{background:#0b1b34;color:#e2e8f0;padding:16px;border-radius:12px;white-space:pre-wrap;word-break:break-word;min-height:120px}</style></head>
<body><h1>Orchid setup check</h1>
<p>Press <b>Run checks</b>, then <b>Copy results</b> and send them back. Delete this file afterwards.</p>
<button id="run">Run checks</button><button class="g" id="goog">Test Google sign-in</button><button class="g" id="out">Sign out</button><button class="g" id="cp">Copy results</button>
<pre id="o">Not run yet.</pre>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL_='https://acxrobzulaswsubfoghg.supabase.co',KEY='sb_publishable_3Ehkqe8QtPVJQoh4FCZIVg_m2f8SOTD';
const o=document.getElementById('o');let L=[];const log=(ok,t)=>{L.push((ok===null?'•':ok?'✓':'✗')+' '+t);o.textContent=L.join('\n')};
let sb;try{sb=window.supabase.createClient(URL_,KEY)}catch(e){}
async function page(name,marks){
  try{const r=await fetch('/'+name+'?x='+Date.now(),{cache:'no-store'});const t=await r.text();
    log(r.ok,name+': HTTP '+r.status+', '+t.length+' bytes');
    for(const [m,label,want] of marks){const has=t.includes(m);log(has===want,'  '+label+': '+(has?'yes':'no'))}
    return t}catch(e){log(false,name+': could not load ('+e.message+')')}
}
async function run(){
  L=[];log(null,'Address: '+location.origin);
  const q=new URLSearchParams(location.search+'&'+location.hash.slice(1));
  if(q.get('error')||q.get('error_description'))log(false,'Returned from Google with error: '+(q.get('error_description')||q.get('error')));
  await page('index.html',[['id="gbtn"','has the Continue with Google button (new index)',true],['orchid-crm-tpl" ','still embeds the CRM (old index)',false],['orchid_crm_try','has the loop guard',true]]);
  const c=await page('crm.html',[['showBounce','is the new crm.html',true],['id="app"','looks like the CRM page',true],['id="gbtn"','is actually index.html served at /crm.html (rewrite problem)',false]]);
  if(!sb)return log(false,'Supabase library did not load');
  const{data:{session},error}=await sb.auth.getSession();
  if(error)log(false,'Session error: '+error.message);
  if(!session)return log(null,'Not signed in on this address. Press "Test Google sign-in".');
  const u=session.user;log(true,'Signed in as '+u.email+' via '+((u.app_metadata&&u.app_metadata.provider)||'?'));
  log(!!session.provider_token,'Google token present right now: '+(session.provider_token?'yes':'no (normal on later visits)'));
  try{const r=await sb.rpc('crm_role');log(!r.error,'crm_role: '+(r.error?r.error.message:JSON.stringify(r.data)))}catch(e){log(false,'crm_role threw: '+e.message)}
  try{const r=await sb.from('crm_messages').select('id').limit(1);log(!r.error,'crm_messages readable: '+(r.error?r.error.message:'yes'))}catch(e){log(false,'crm_messages threw: '+e.message)}
  try{const r=await sb.from('google_links').select('user_id').limit(1);log(null,'google_links table: '+(r.error?r.error.message:'exists'))}catch(e){}
}
document.getElementById('run').onclick=run;
document.getElementById('goog').onclick=()=>sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname,scopes:'openid email profile https://www.googleapis.com/auth/gmail.send https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/calendar.events',queryParams:{access_type:'offline',prompt:'consent'}}});
document.getElementById('out').onclick=async()=>{await sb.auth.signOut();L=[];log(true,'Signed out');};
document.getElementById('cp').onclick=()=>navigator.clipboard.writeText(o.textContent).then(()=>alert('Copied'));
if(location.search||location.hash)run();
</script></body></html>
