<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14122e;--muted:#64748b;--line:rgba(20,18,46,.09);--brand:#059669;--grad:linear-gradient(135deg,#059669,#84cc16);--glass:rgba(255,255,255,.66);--sh:0 10px 40px rgba(60,70,140,.10);--dark:#1b1a2e;--danger:#be123c;--warn:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}html,body{margin:0;min-height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);line-height:1.5;background:radial-gradient(900px 520px at 6% 0%,#cdf5e0 0,transparent 60%),radial-gradient(800px 600px at 96% 8%,#f3f8c9 0,transparent 55%),radial-gradient(900px 600px at 50% 100%,#c8e8f1 0,transparent 60%),#eef4f1;background-attachment:fixed}
button,input,textarea,select{font:inherit;color:inherit}[hidden]{display:none!important}
:focus-visible{outline:3px solid rgba(5,150,105,.45);outline-offset:2px}

.center{min-height:100vh;display:grid;place-items:center;padding:24px}
.panel,.card{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.85);border-radius:24px;box-shadow:var(--sh)}
.panel{padding:36px 30px;max-width:420px;width:100%;text-align:center}.panel h1{font-size:1.5rem;margin:12px 0 6px}.sub{color:var(--muted);margin:0 0 20px}
.muted{color:var(--muted)}
.btn{border:0;cursor:pointer;border-radius:999px;padding:9px 18px;font-weight:700;font-size:.9rem;display:inline-block;transition:transform .15s}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.6}
.primary{background:var(--dark);color:#fff}.go{background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(5,150,105,.28)}

input[type=text],input[type=email],input[type=password],input[type=tel],input[type=date],input[type=number],textarea,select{width:100%;padding:10px 14px;border:1px solid #e2e8f0;border-radius:12px;background:rgba(255,255,255,.85)}

label.f{display:block;font-size:.82rem;font-weight:700;margin-top:12px;text-align:left}label.f>*:last-child{margin-top:5px;font-weight:400}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(238,244,241,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1000px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}.sp{flex:1}
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:100%;padding:2px}
.tab{border:0;background:none;cursor:pointer;padding:8px 14px;border-radius:999px;font-weight:700;font-size:.88rem;color:var(--muted);white-space:nowrap}
.tab:hover{background:rgba(255,255,255,.7)}.tab[aria-selected=true]{background:var(--dark);color:#fff}.tab .n{margin-left:6px;font-size:.75rem;opacity:.8}
main{max-width:1000px;margin:0 auto;padding:22px 18px 80px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.bar input[type=text]{max-width:260px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid #e2e8f0;background:#fff;border-radius:999px;padding:5px 12px;font-size:.8rem;font-weight:700;cursor:pointer}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{padding:16px 18px}.stat .v{font-size:1.8rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}.stat .l{color:var(--muted);font-size:.85rem;font-weight:600}.stat.hot .v{color:var(--danger)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:10px}.item{padding:14px 18px;display:flex;gap:12px;align-items:flex-start}
.item .body{flex:1;min-width:0}.t{font-weight:700;overflow-wrap:anywhere}.s{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}.m{font-size:.9rem;margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pill{display:inline-block;font-size:.72rem;font-weight:800;padding:2px 10px;border-radius:999px;background:#e2e8f0;margin-left:6px}
.pill.new,.pill.scheduled,.pill.cool{background:#dbeafe;color:#1d4ed8}.pill.contacted,.pill.warm{background:#fef3c7;color:#92400e}.pill.quoted{background:#ede9fe;color:#5b21b6}
.pill.won,.pill.done,.pill.paid{background:#d1fae5;color:#065f46}.pill.lost,.pill.hot,.pill.unpaid,.pill.high{background:#fee2e2;color:#991b1b}.pill.cancelled{background:#f1f5f9;color:#475569}
.due{font-size:.82rem;font-weight:600;color:var(--muted)}.due.over{color:var(--danger)}.due.today{color:var(--warn)}
.chk{width:22px;height:22px;margin-top:2px;accent-color:var(--brand);flex:none;cursor:pointer}.done .t{text-decoration:line-through;color:var(--muted)}
.next{padding:18px 22px;margin-bottom:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-left:6px solid #f97316}
.next .k{font-size:.82rem;font-weight:700;color:var(--muted)}.next .w{font-size:1.15rem;font-weight:800;letter-spacing:-.02em}
.empty{text-align:center;color:var(--muted);padding:32px 16px}.empty b{display:block;color:var(--ink);margin-bottom:4px}
.err{color:var(--danger);font-size:.88rem;margin-top:10px;min-height:1.2em}
.scrim{position:fixed;inset:0;background:rgba(20,18,46,.45);display:grid;place-items:center;padding:18px;z-index:50}
.modal{background:#fff;border-radius:24px;padding:24px;width:100%;max-width:460px;max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(20,18,46,.35)}
.modal h2{margin:0 0 4px;font-size:1.25rem}.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 18px;border-radius:999px;z-index:99;font-size:.88rem;max-width:90%}
pre{text-align:left;background:#f1f5f9;border-radius:12px;padding:10px;font-size:.8rem;overflow:auto}
/* CRM-style layout: top bar + left sidebar */
.top-in{max-width:none;padding:12px 24px}
.shell{display:flex;align-items:flex-start;min-height:calc(100vh - var(--topH,57px))}
.side{width:248px;flex:none;position:sticky;top:var(--topH,57px);height:calc(100vh - var(--topH,57px));overflow-y:auto;padding:16px 12px;background:rgba(255,255,255,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-right:1px solid rgba(229,233,242,.9)}
.side:before{content:"WORKSPACE";display:block;padding:4px 12px 10px;color:#9aa2b3;font-size:.66rem;font-weight:800;letter-spacing:.12em}
.side .tabs{display:flex;flex-direction:column;gap:4px;overflow:visible;padding:0}
.side .tab{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;min-height:43px;border-radius:11px;font-weight:600;font-size:.94rem;color:#596276;background:none;transition:background .18s,color .18s}
.side .tab:hover{background:#f2f4fa;color:#263149}
.side .tab[aria-selected=true]{background:linear-gradient(90deg,rgba(5,150,105,.14),rgba(5,150,105,.05));color:#047857;box-shadow:inset 3px 0 0 var(--brand)}
.side .tab .ico{display:inline-flex;flex:none;color:#7a8295}.side .tab[aria-selected=true] .ico{color:var(--brand)}
.side .tab .ico svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side .tab .n{margin-left:auto;background:#e2e8f0;color:#334155;border-radius:999px;padding:0 8px;font-size:.72rem;opacity:1}
.side .tab[aria-selected=true] .n{background:var(--brand);color:#fff}
.shell>main{flex:1;min-width:0;max-width:1060px;margin:0 auto;width:100%;padding:24px 28px 80px}
@media(max-width:760px){
  .top-in{padding:10px 12px;flex-wrap:nowrap;gap:8px}.top-in .em{display:none}.top-in .wm{font-size:1.15rem}
  .shell{display:block;min-height:0}
  .side{width:100%;height:auto;position:sticky;top:var(--topH,53px);z-index:15;padding:6px 10px;border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  .side:before{display:none}
  .side .tabs{flex-direction:row;overflow-x:auto;gap:4px;scrollbar-width:none}.side .tabs::-webkit-scrollbar{display:none}
  .side .tab{width:auto;flex:0 0 auto;min-height:0;padding:7px 12px;font-size:.82rem;gap:7px;white-space:nowrap}
  .side .tab .ico svg{width:16px;height:16px}
  .shell>main{padding:14px 12px 80px}
}
#oai-fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;width:56px;height:56px;border-radius:50%;border:0;cursor:pointer;color:#fff;font-size:1.5rem;background:var(--grad);box-shadow:0 8px 24px rgba(5,150,105,.35)}
#oai-panel{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:41;width:min(400px,calc(100vw - 24px));height:min(560px,calc(100dvh - 120px));display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 60px rgba(15,23,42,.22);overflow:hidden}
#oai-panel[hidden]{display:none!important}
.oai-hd{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--grad);color:#fff}.oai-hd .s{font-size:.72rem;color:rgba(255,255,255,.92)}
.oai-x{border:0;background:rgba(255,255,255,.2);color:#fff;width:30px;height:30px;border-radius:8px;cursor:pointer}
.oai-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#f8fafc;overscroll-behavior:contain}
.oai-m{max-width:88%;padding:9px 12px;border-radius:14px;font-size:.875rem;white-space:pre-wrap;overflow-wrap:anywhere}
.oai-m.u{align-self:flex-end;background:var(--brand);color:#fff}.oai-m.a{align-self:flex-start;background:#fff;border:1px solid #e2e8f0}.oai-m.e{align-self:flex-start;background:#fff1f2;color:var(--danger);border:1px solid #fecdd3}
.oai-act{align-self:stretch;background:#fff;border:1px solid #a7f3d0;border-left:4px solid var(--brand);border-radius:12px;padding:10px 12px;font-size:.85rem}
.oai-act.err{border-color:#fecdd3;border-left-color:var(--danger);color:var(--danger)}
.oai-act .at{font-weight:800;margin-bottom:4px}.oai-act .al{color:#334155;overflow-wrap:anywhere}
.oai-act .ab{display:flex;gap:8px;margin-top:10px}
.oai-act .ab button{border:0;cursor:pointer;border-radius:999px;padding:6px 14px;font-weight:700;font-size:.8rem}
.oai-act .ab .ok{background:var(--grad);color:#fff}.oai-act .ab .no{background:#fff;border:1px solid #e2e8f0}.oai-act .ab button:disabled{opacity:.6}
.oai-ft{display:flex;gap:8px;align-items:flex-end;padding:10px;border-top:1px solid #e2e8f0}.oai-ft textarea{min-height:40px;max-height:110px;resize:none;padding:9px 12px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
/* ---- Uses the same Orchid login as the CRM (same Supabase project). Run solopreneur_setup.sql there once. ---- */
const SB_URL='https://acxrobzulaswsubfoghg.supabase.co';
const SB_KEY='sb_publishable_3Ehkqe8QtPVJQoh4FCZIVg_m2f8SOTD';
const CUR='₱';           // currency symbol
const CHECKIN_DAYS=60;   // nudge to re-contact a customer after this many days
const sb=window.__orchidSb||(window.__orchidSb=window.supabase.createClient(SB_URL,SB_KEY));
const AI_URL=SB_URL+'/functions/v1/solo-ai';

const $=s=>document.querySelector(s);
const h=(t,a={},...c)=>{const el=document.createElement(t);for(const k in a){if(k==='text')el.textContent=a[k];else if(k.startsWith('on'))el.addEventListener(k.slice(2),a[k]);else if(a[k]===true)el.setAttribute(k,'');else if(a[k]!==false&&a[k]!=null)el.setAttribute(k,a[k])}c.flat().forEach(x=>x!=null&&x!==false&&el.append(x.nodeType?x:document.createTextNode(x)));return el};
const toast=t=>{const e=h('div',{class:'toast',text:t,role:'status'});document.body.append(e);setTimeout(()=>e.remove(),3000)};
const fail=(e,m)=>{console.error(e);toast(m||'Something went wrong. Please try again.')};
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const iso=()=>new Date().toISOString();
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const inDays=n=>ymd(new Date(Date.now()+n*864e5));
const fmtDate=d=>d?new Date(d+'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'';
const daysAgo=t=>Math.floor((Date.now()-new Date(t))/864e5);
const money=n=>CUR+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2});
const nullify=o=>{for(const k in o)if(typeof o[k]==='string'){o[k]=o[k].trim();if(o[k]==='')o[k]=null}return o};

const TB={leads:'solo_leads',customers:'solo_customers',jobs:'solo_jobs',tasks:'solo_tasks',expenses:'solo_expenses'};
const STAGES=['new','contacted','quoted','won','lost'],JOBST=['scheduled','done','cancelled'];
let ef='all';
let me=null,D={leads:[],customers:[],jobs:[],tasks:[],expenses:[]},view='today',q='',lf='all',jf='upcoming',tf='open',state='loading';

async function load(){
  const ks=Object.keys(TB),r=await Promise.all(ks.map(k=>sb.from(TB[k]).select('*').order('created_at',{ascending:false})));
  const e=r.find(x=>x.error);if(e)throw e.error;ks.forEach((k,i)=>D[k]=r[i].data);
}
async function run(p,ok){const r=await p;if(r.error)return fail(r.error);try{await load()}catch(e){return fail(e,'Saved, but could not refresh. Please reload.')}if(ok)toast(ok);render()}
const cust=id=>D.customers.find(c=>c.id===id),cname=id=>(cust(id)||{}).name||'';
const custOpts=()=>[{v:'',t:'No customer'},...D.customers.map(c=>({v:c.id,t:c.name}))];
const match=(o,keys)=>!q||keys.some(k=>String(o[k]||'').toLowerCase().includes(q.toLowerCase()));

/* ---- modal form ---- */
function openForm({title,fields,values={},saveText='Save',onSave}){
  const inp={};
  const form=h('div',{},...fields.map(f=>{
    let el;
    if(f.type==='textarea')el=h('textarea',{id:'f_'+f.k});
    else if(f.type==='select')el=h('select',{id:'f_'+f.k},...f.options.map(o=>h('option',{value:o.v,text:o.t})));
    else el=h('input',{id:'f_'+f.k,type:f.type||'text',step:f.type==='number'?'any':null,min:f.type==='number'?'0':null,placeholder:f.ph||null});
    el.value=values[f.k]??f.def??'';inp[f.k]=el;
    return h('label',{class:'f',for:'f_'+f.k},f.label,el);
  }));
  const err=h('div',{class:'err',role:'alert'});
  const close=()=>{scrim.remove();document.removeEventListener('keydown',esc)},esc=e=>{if(e.key==='Escape')close()};
  const save=h('button',{class:'btn go',text:saveText,onclick:async()=>{
    const out={};
    for(const f of fields){out[f.k]=inp[f.k].value;
      if(f.req&&!out[f.k].trim()){err.textContent=f.label+' is required.';inp[f.k].focus();return}
      if(f.type==='email'&&out[f.k].trim()&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(out[f.k].trim())){err.textContent='Enter a valid email address.';inp[f.k].focus();return}}
    save.disabled=true;try{await onSave(nullify(out));close()}finally{save.disabled=false}
  }});
  const scrim=h('div',{class:'scrim',onclick:e=>{if(e.target===scrim)close()}},
    h('div',{class:'modal',role:'dialog','aria-modal':'true','aria-label':title},h('h2',{text:title}),form,err,
      h('div',{class:'row'},h('button',{class:'btn ghost',text:'Cancel',onclick:close}),save)));
  document.body.append(scrim);document.addEventListener('keydown',esc);
  const f1=scrim.querySelector('input,textarea,select');f1&&f1.focus();
}

/* ---- leads ---- */
const leadF=()=>[{k:'name',label:'Name',req:true},{k:'phone',label:'Phone',type:'tel'},{k:'email',label:'Email',type:'email'},
  {k:'source',label:'Where they found you',ph:'Facebook, referral, walk-in…'},{k:'value',label:'Estimated value ('+CUR+')',type:'number'},
  {k:'stage',label:'Stage',type:'select',options:STAGES.map(s=>({v:s,t:cap(s)})),def:'new'},{k:'notes',label:'What they need',type:'textarea'}];
const addLead=()=>openForm({title:'New lead',fields:leadF(),saveText:'Add lead',onSave:v=>run(sb.from(TB.leads).insert(v),'Lead added.')});
const editLead=l=>openForm({title:'Edit lead',fields:leadF(),values:l,onSave:v=>run(sb.from(TB.leads).update(v).eq('id',l.id),'Lead saved.')});
const setStage=(l,s)=>run(sb.from(TB.leads).update({stage:s,last_touch:iso()}).eq('id',l.id));
const touch=l=>run(sb.from(TB.leads).update({last_touch:iso()}).eq('id',l.id),'Touch logged.');
const delLead=l=>{if(confirm('Delete the lead '+l.name+'?'))run(sb.from(TB.leads).delete().eq('id',l.id),'Lead deleted.')};
async function toCustomer(l){
  const r=await sb.from(TB.customers).insert({name:l.name,phone:l.phone,email:l.email,notes:l.notes}).select('id').single();
  if(r.error)return fail(r.error);
  await run(sb.from(TB.leads).update({customer_id:r.data.id,stage:'won',last_touch:iso()}).eq('id',l.id),'Customer created.');
}
const idle=l=>daysAgo(l.last_touch||l.created_at);
const coldLead=l=>(l.stage==='contacted'||l.stage==='quoted')&&idle(l)>=4;

/* ---- customers ---- */
const custF=()=>[{k:'name',label:'Name',req:true},{k:'phone',label:'Phone',type:'tel'},{k:'email',label:'Email',type:'email'},{k:'address',label:'Address'},{k:'notes',label:'Notes',type:'textarea'}];
const addCust=()=>openForm({title:'New customer',fields:custF(),saveText:'Add customer',onSave:v=>run(sb.from(TB.customers).insert(v),'Customer added.')});
const editCust=c=>openForm({title:'Edit customer',fields:custF(),values:c,onSave:v=>run(sb.from(TB.customers).update(v).eq('id',c.id),'Customer saved.')});
const delCust=c=>{if(confirm('Delete '+c.name+'? Their jobs stay but are unlinked.'))run(sb.from(TB.customers).delete().eq('id',c.id),'Customer deleted.')};
const custJobs=c=>D.jobs.filter(j=>j.customer_id===c.id&&j.status!=='cancelled');
const lastJob=c=>custJobs(c).filter(j=>j.status==='done'&&j.scheduled_on).map(j=>j.scheduled_on).sort().pop();

/* ---- jobs ---- */
const jobF=()=>[{k:'title',label:'Job',req:true,ph:'Haircut, aircon cleaning, catering order…'},{k:'customer_id',label:'Customer',type:'select',options:custOpts()},
  {k:'scheduled_on',label:'Date',type:'date'},{k:'price',label:'Price ('+CUR+')',type:'number'},
  {k:'status',label:'Status',type:'select',options:JOBST.map(s=>({v:s,t:cap(s)})),def:'scheduled'},{k:'notes',label:'Notes',type:'textarea'}];
const addJob=cid=>openForm({title:'New job',fields:jobF(),values:{customer_id:cid||'',scheduled_on:today()},saveText:'Add job',onSave:v=>run(sb.from(TB.jobs).insert(v),'Job added.')});
const editJob=j=>openForm({title:'Edit job',fields:jobF(),values:j,onSave:v=>run(sb.from(TB.jobs).update(v).eq('id',j.id),'Job saved.')});
const jobStatus=(j,s)=>run(sb.from(TB.jobs).update({status:s}).eq('id',j.id));
const togglePaid=j=>run(sb.from(TB.jobs).update({paid:!j.paid}).eq('id',j.id),j.paid?null:'Marked paid.');
const delJob=j=>{if(confirm('Delete this job?'))run(sb.from(TB.jobs).delete().eq('id',j.id),'Job deleted.')};
const owed=j=>j.status==='done'&&!j.paid&&Number(j.price)>0;

/* ---- tasks ---- */
const taskF=()=>[{k:'title',label:'Task',req:true},{k:'due_date',label:'Due date',type:'date'}];

const aiTxt=(v,n)=>{v=String(v==null?'':v).trim().slice(0,n||200);return v||null};
const aiNum=v=>{const n=parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,''));return isFinite(n)&&n>=0?n:null};
const aiDate=v=>{v=String(v||'');return /^\d{4}-\d{2}-\d{2}$/.test(v)&&!isNaN(new Date(v+'T00:00:00'))?v:null};
const aiEmail=v=>{v=aiTxt(v,120);return v&&/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)?v:null};
const aiCust=q=>{q=String(q||'').toLowerCase().trim();if(!q)return null;return D.customers.find(c=>c.name.toLowerCase()===q)||(()=>{const f=D.customers.filter(c=>c.name.toLowerCase().includes(q));return f.length===1?f[0]:null})()};
function aiPlan(a){
  a=a||{};
  const add=(table,values,msg,title)=>async()=>{
    const r=await sb.from(table).insert(values);
    if(r.error){console.error(r.error);throw new Error('Could not save it. Please try again.')}
    try{await load()}catch(e){console.error(e)}render();toast(msg);return msg;
  };
  if(a.type==='add_customer'){
    const name=aiTxt(a.name,120);if(!name)return{error:'I need the customer\u2019s name.'};
    const v={name,phone:aiTxt(a.phone,40),email:aiEmail(a.email),address:aiTxt(a.address,200),notes:aiTxt(a.notes,500)};
    const lines=['Name: '+name];if(v.phone)lines.push('Phone: '+v.phone);if(v.email)lines.push('Email: '+v.email);if(v.address)lines.push('Address: '+v.address);if(v.notes)lines.push('Notes: '+v.notes);
    if(D.customers.some(c=>c.name.toLowerCase()===name.toLowerCase()))lines.push('Heads up: a customer with this name already exists.');
    return{title:'Add customer',lines,confirm:'Add customer',exec:add(TB.customers,v,'Customer added.')};
  }
  if(a.type==='add_lead'){
    const name=aiTxt(a.name,120);if(!name)return{error:'I need the lead\u2019s name.'};
    const stage=STAGES.includes(a.stage)?a.stage:'new',val=aiNum(a.value);
    const v={name,phone:aiTxt(a.phone,40),email:aiEmail(a.email),source:aiTxt(a.source,100),value:val,stage,notes:aiTxt(a.notes,500)};
    const lines=['Name: '+name];if(v.phone)lines.push('Phone: '+v.phone);if(v.email)lines.push('Email: '+v.email);if(v.source)lines.push('Source: '+v.source);if(val!=null)lines.push('Estimated value: '+money(val));lines.push('Stage: '+cap(stage));if(v.notes)lines.push('Needs: '+v.notes);
    return{title:'Add lead',lines,confirm:'Add lead',exec:add(TB.leads,v,'Lead added.')};
  }
  if(a.type==='add_job'){
    const title=aiTxt(a.title,200);if(!title)return{error:'I need a job title.'};
    const date=aiDate(a.date)||today(),price=aiNum(a.price),status=JOBST.includes(a.status)?a.status:'scheduled';
    const lines=['Job: '+title,'Date: '+fmtDate(date),'Status: '+cap(status)];
    let cid=null;
    if(a.customer){const c=aiCust(a.customer);if(c){cid=c.id;lines.push('Customer: '+c.name)}else lines.push('Customer: \"'+String(a.customer).slice(0,60)+'\" not found, left blank')}
    if(price!=null)lines.push('Price: '+money(price));
    const v={title,customer_id:cid,scheduled_on:date,price,status,notes:aiTxt(a.notes,500)};
    if(v.notes)lines.push('Notes: '+v.notes);
    return{title:'Add job',lines,confirm:'Add job',exec:add(TB.jobs,v,'Job added.')};
  }
  if(a.type==='add_expense'){
    const title=aiTxt(a.title,200);if(!title)return{error:'I need to know what the expense was for.'};
    const amount=aiNum(a.amount);if(amount==null||amount<=0)return{error:'I need a valid amount for the expense.'};
    const cat=CATS.find(c=>c.toLowerCase()===String(a.category||'').toLowerCase())||'Other',date=aiDate(a.date)||today();
    const v={title,category:cat,amount,spent_on:date,notes:aiTxt(a.notes,500)};
    const lines=['For: '+title,'Amount: '+money(amount),'Category: '+cat,'Date: '+fmtDate(date)];if(v.notes)lines.push('Notes: '+v.notes);
    return{title:'Add expense',lines,confirm:'Add expense',exec:add(TB.expenses,v,'Expense added.')};
  }
  if(a.type==='add_task'){
    const title=aiTxt(a.title,200);if(!title)return{error:'I need a task title.'};
    const due=aiDate(a.due_date);
    const lines=['Task: '+title,'Due: '+(due?fmtDate(due):'no date')];
    return{title:'Add task',lines,confirm:'Add task',exec:add(TB.tasks,{title,due_date:due},'Task added.')};
  }
  return{error:'I cannot do that kind of action.'};
}

/* ---- AI assistant (via Supabase Edge Function "solo-ai") ---- */
function mountAI(){
  if($('#oai-fab'))return;
  const msgs=[];let busy=false;
  const fab=h('button',{id:'oai-fab',type:'button','aria-label':'Open AI assistant',text:'✨'});
  const body=h('div',{class:'oai-body'}),inp=h('textarea',{rows:'1',placeholder:'Ask about your business…','aria-label':'Message'}),send=h('button',{class:'btn go sm',type:'button',text:'Send'});
  const panel=h('section',{id:'oai-panel',role:'dialog','aria-label':'AI assistant',hidden:true},
    h('div',{class:'oai-hd'},h('div',{},h('b',{text:'Orchid Assistant'}),h('div',{class:'s',text:'Powered by AI'})),h('span',{class:'sp'}),h('button',{class:'oai-x',type:'button',text:'✕','aria-label':'Close',onclick:()=>panel.hidden=true})),
    body,h('div',{class:'oai-ft'},inp,send));
  const add=(c,t)=>{const m=h('div',{class:'oai-m '+c,text:t});body.append(m);body.scrollTop=body.scrollHeight;return m};
  const hi=()=>{body.replaceChildren(h('div',{class:'empty'},h('b',{text:'Hi, how can I help?'}),'I can read your data, draft messages, and add customers, jobs, expenses, leads and tasks. I always ask you to confirm first.',h('div',{class:'chips',style:'justify-content:center;margin-top:10px'},['Who should I follow up with?','Who still owes me money?','Add a task for tomorrow','Log an expense'].map(t=>h('button',{class:'chip',type:'button',text:t,onclick:()=>ask(t)})))))};
  function actionCard(a,at){
    const p=aiPlan(a),card=h('div',{class:'oai-act'});
    if(!p||p.error){card.classList.add('err');card.textContent=(p&&p.error)||'I could not prepare that action.';body.append(card);body.scrollTop=body.scrollHeight;return}
    const note=t=>{if(msgs[at]&&msgs[at].role==='model')msgs[at].text+='\n['+t+']'};
    const ok=h('button',{type:'button',class:'ok',text:p.confirm||'Confirm'}),no=h('button',{type:'button',class:'no',text:'Cancel'});
    ok.onclick=async()=>{ok.disabled=no.disabled=true;ok.textContent='Working…';
      try{const m=await p.exec();card.classList.remove('err');card.replaceChildren(h('div',{class:'at',text:'✓ '+m}));note('The user confirmed. '+m)}
      catch(e){card.classList.add('err');card.replaceChildren(h('div',{class:'at',text:e.message||'Something went wrong.'}));note('The action failed.')}
      body.scrollTop=body.scrollHeight};
    no.onclick=()=>{card.replaceChildren(h('div',{class:'al',text:'Cancelled.'}));note('The user cancelled this action.')};
    card.append(h('div',{class:'at',text:p.title}),...p.lines.map(l=>h('div',{class:'al',text:l})),h('div',{class:'ab'},ok,no));
    body.append(card);body.scrollTop=body.scrollHeight;
  }
  async function ask(text){
    text=(text||'').trim();if(!text||busy)return;
    if(!msgs.length)body.replaceChildren();
    msgs.push({role:'user',text});add('u',text);inp.value='';busy=true;send.disabled=true;
    const w=add('a','…');
    try{
      const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Your session ended. Please log in again.');
      const r=await fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token,apikey:SB_KEY},body:JSON.stringify({messages:msgs,today:today(),tz:(Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC')})});
      let d={};try{d=await r.json()}catch(e){}
      w.remove();
      if(!r.ok||!d.reply){msgs.pop();add('e',r.status===404?'The AI is not deployed yet.':(d.error||'Something went wrong. Please try again.'))}
      else{msgs.push({role:'model',text:d.reply});add('a',d.reply);const at=msgs.length-1;(Array.isArray(d.actions)?d.actions:[]).slice(0,3).forEach(a=>actionCard(a,at))}
    }catch(e){w.remove();msgs.pop();add('e',e.message&&e.message.includes('log in')?e.message:'Could not reach the assistant.')}
    busy=false;send.disabled=false;inp.focus();
  }
  send.addEventListener('click',()=>ask(inp.value));
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(inp.value)}});
  fab.addEventListener('click',()=>{panel.hidden=!panel.hidden;if(!panel.hidden){if(!msgs.length&&!body.children.length)hi();setTimeout(()=>inp.focus(),50)}});
  document.body.append(fab,panel);
}
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return home();   // not signed in through the Orchid launcher
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'){leaving=true;out()}});
  me={id:session.user.id,email:session.user.email};
  try{await load();state='app'}catch(e){console.error(e);state='setup'}
  render();
  if(state==='app')mountAI();
}
boot().catch(e=>{console.error(e);home()});
})();
</script>
