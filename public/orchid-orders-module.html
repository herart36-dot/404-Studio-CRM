async function saveItem(btn){const f=S.form,name=String(f.name||'').trim();if(!name)return toast('Please enter a name.');

 if(!isFinite(price)||price<0||!isFinite(stock)||!isFinite(low))return toast('Please check the price and stock numbers.');
 const label=btn.textContent;btn.disabled=true;btn.textContent='Saving…';
 try{let url=f.image_url||null;const st=sb().storage.from('crm-menu');
  if(f._blob){const path='items/'+(crypto.randomUUID?crypto.randomUUID():Date.now())+'.jpg',up=await st.upload(path,f._blob,{contentType:'image/jpeg',cacheControl:'31536000'});if(up.error)throw up.error;
   const old=f.image_url?f.image_url.split('/crm-menu/')[1]:null;url=st.getPublicUrl(path).data.publicUrl;if(old)st.remove([old]).catch(()=>{})}
  const row={name,category:String(f.category||'').trim()||null,description:String(f.description||'').trim()||null,price,stock_qty:stock,low_stock_at:low,track_stock:f.track_stock!==false,active:f.active!==false,image_url:url,updated_at:new Date().toISOString()};
  const{error}=await(f.id?sb().from('crm_menu_items').update(row).eq('id',f.id):sb().from('crm_menu_items').insert({...row,created_by:String((D().me&&D().me.email)||'').toLowerCase()}));if(error)throw error;
  S.form=null;toast('Saved ✓');await load(true);paint()}
 catch(e){toast(er(e));btn.disabled=false;btn.textContent=label}}
async function delItem(f){if(!confirm('Delete “'+f.name+'”? Past orders and inventory sheets keep their records. Tip: untick “Available to order” to hide it instead.'))return;
 try{const{error}=await sb().from('crm_menu_items').delete().eq('id',f.id);if(error)throw error;const old=f.image_url?f.image_url.split('/crm-menu/')[1]:null;if(old)sb().storage.from('crm-menu').remove([old]).catch(()=>{});S.form=null;toast('Deleted');await load(true);paint()}catch(e){toast(er(e))}}

/* ---------- daily inventory (sheets are locked by the database) ---------- */
function invTab(){const s=S.set||{},tz=s.timezone||'Asia/Manila',tzs=[...new Set(['Asia/Manila','Asia/Singapore','Asia/Hong_Kong','Asia/Tokyo','Asia/Dubai','Europe/London','America/New_York','America/Chicago','America/Los_Angeles','Australia/Sydney','UTC',tz])];
 const en=h('input',{type:'checkbox',checked:s.enabled!==false,disabled:!admin()}),tm=h('input',{type:'time',value:String(s.gen_time||'22:00').slice(0,5),disabled:!admin(),'aria-label':'Generate time'}),zs=h('select',{disabled:!admin(),'aria-label':'Time zone'},tzs.map(z=>h('option',{value:z,text:z,selected:z===tz})));
 const today=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()),has=S.days.some(d=>d.day===today);
 const save=h('button',{class:'btn primary sm',type:'button',onclick:async()=>{if(!tm.value)return toast('Pick a time.');save.disabled=true;try{const{error}=await sb().rpc('crm_save_inventory_settings',{p_enabled:en.checked,p_time:tm.value,p_tz:zs.value});if(error)throw error;toast('Schedule saved ✓');await load(true);paint()}catch(e){toast(er(e));save.disabled=false}}},'Save schedule');
 const gen=h('button',{class:'btn ghost sm',type:'button',onclick:async()=>{if(!confirm('Generate today’s inventory sheet now? It is locked immediately, and no other sheet will be made for today.'))return;gen.disabled=true;try{const{error}=await sb().rpc('crm_generate_inventory_now');if(error)throw error;toast('Inventory sheet created and locked ✓');S.openDay=null;await load(true);paint()}catch(e){toast(er(e));gen.disabled=false}}},'Generate today’s sheet now');
 const card=h('div',{class:'card ord-set'},h('h3',{text:'Daily inventory schedule'}),
  h('p',{class:'sub',text:'Every day at the time below, the system builds that day’s sheet by itself: opening stock, units sold and closing stock for every tracked item. The moment a sheet is created it is locked. Nobody, not even an admin, can edit or delete it.'}),
  h('div',{class:'ord-sr'},h('label',{class:'ord-ck'},en,' Auto-generate every day'),h('label',{class:'ord-f in'},h('span',{text:'Time'}),tm),h('label',{class:'ord-f in'},h('span',{text:'Time zone'}),zs),admin()?save:null),
  h('div',{class:'ord-note',text:(has?'✓ Today’s sheet is ready and locked.':'Today’s sheet has not been generated yet.')+(admin()?'':' Only an admin can change the schedule.')}),admin()?h('div',{},gen):null);
 const list=S.days.map(d=>{const open=S.openDay===d.id;
  return h('div',{class:'card ord-day'},h('button',{type:'button',class:'ord-dh','aria-expanded':String(open),onclick:()=>toggleDay(d)},h('b',{text:fmtDay(d.day)}),h('span',{class:'ord-lock',text:'🔒 Locked'}),h('small',{text:'Generated '+new Date(d.generated_at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+(d.source==='manual'?' (by hand)':' (automatic)')}),h('span',{class:'car',text:open?'▲':'▼'})),open?dayBody(d):null)});
 return h('div',{},card,h('div',{class:'ord-sech'},h('h3',{text:'Daily sheets'})),list.length?list:h('div',{class:'ord-empty',text:'No sheets yet. The first one appears at the time you set above.'}))}
async function toggleDay(d){if(S.openDay===d.id){S.openDay=null;paint();return}
 S.openDay=d.id;paint();
 if(!S.lines[d.id]){try{const{data,error}=await sb().from('crm_inventory_lines').select('*').eq('day_id',d.id).order('name');if(error)throw error;S.lines[d.id]=data||[]}catch(e){toast(er(e));S.openDay=null}paint()}}
function dayBody(d){const L=S.lines[d.id];if(!L)return h('div',{class:'ord-empty sm',text:'Loading…'});if(!L.length)return h('div',{class:'ord-empty sm',text:'No tracked items on this day.'});
 const adj=x=>x.closing_qty-x.opening_qty+x.sold_qty,sold=L.reduce((a,x)=>a+x.sold_qty,0),val=L.reduce((a,x)=>a+x.sold_qty*Number(x.unit_price),0);
 return h('div',{class:'ord-wrap'},h('table',{class:'ord-tb'},h('thead',{},h('tr',{},['Item','Opening','Sold','Added','Closing','Sales'].map(t=>h('th',{text:t})))),
  h('tbody',{},L.map(x=>h('tr',{},h('td',{text:x.name}),h('td',{text:String(x.opening_qty)}),h('td',{text:String(x.sold_qty)}),h('td',{text:adj(x)>0?'+'+adj(x):adj(x)<0?String(adj(x)):'–'}),h('td',{text:String(x.closing_qty)}),h('td',{text:peso(x.sold_qty*x.unit_price)})))),
  h('tfoot',{},h('tr',{},h('td',{text:'Total'}),h('td'),h('td',{text:String(sold)}),h('td'),h('td'),h('td',{text:peso(val)})))),
  h('div',{style:'margin-top:10px'},h('button',{class:'btn ghost sm',type:'button',onclick:()=>csv(d,L)},'Download CSV')))}
function csv(d,L){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',rows=[['Date','Item','Category','Unit price','Opening','Sold','Added/adjusted','Closing','Sales'],...L.map(x=>[d.day,x.name,x.category||'',x.unit_price,x.opening_qty,x.sold_qty,x.closing_qty-x.opening_qty+x.sold_qty,x.closing_qty,x.sold_qty*x.unit_price])];
 const a=h('a',{href:URL.createObjectURL(new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'})),download:'inventory-'+d.day+'.csv'});document.body.append(a);a.click();a.remove()}
