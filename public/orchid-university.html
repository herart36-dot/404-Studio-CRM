<style>

:focus-visible{outline:3px solid rgba(234,88,12,.4);outline-offset:2px}

input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(234,88,12,.15)}textarea{resize:vertical;min-height:90px}
label.f{display:block;font-size:.8rem;font-weight:600;margin-top:12px;color:#3b3355}label.f>*:last-child{margin-top:5px;font-weight:400}

<div id="app"></div>
<script>
(function(){
const sb=window.supabase.createClient('https://acxrobzulaswsubfoghg.supabase.co','sb_publishable_3Ehkqe8QtPVJQoh4FCZIVg_m2f8SOTD');
const $=s=>document.querySelector(s);
const h=(t,a={},...c)=>{const el=document.createElement(t);for(const k in a){if(k==='text')el.textContent=a[k];else if(k.startsWith('on'))el.addEventListener(k.slice(2),a[k]);else if(a[k]===true)el.setAttribute(k,'');else if(a[k]!==false&&a[k]!=null)el.setAttribute(k,a[k])}c.flat().forEach(x=>x!=null&&x!==false&&el.append(x.nodeType?x:document.createTextNode(x)));return el};
const toast=t=>{const e=h('div',{class:'toast',text:t,role:'status'});document.body.append(e);setTimeout(()=>e.remove(),2800)};
const fail=e=>{console.error(e);toast(e&&e.message?e.message:'Something went wrong. Try again.')};
const GLYPH='<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 5l14 7-14 7L2 12z" fill="#fff"/><path d="M8 16v5c0 2 4 4 8 4s8-2 8-4v-5l-8 4z" fill="#fff" opacity=".85"/><path d="M28 12.5V21" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><circle cx="28" cy="22.6" r="1.8" fill="#fff"/></svg>';
const tile=(c='')=>{const s=h('span',{class:'ic '+c});s.innerHTML=GLYPH;return s};
const wm=()=>h('span',{class:'wm'},h('b',{text:'O'}),'rchid',h('span',{class:'lg',text:'University'}));
const COLORS=['#f97316,#db2777','#7c3aed,#d946ef','#2563eb,#06b6d4','#059669,#84cc16','#e11d48,#f59e0b','#0f766e,#38bdf8'];
const grad=i=>'linear-gradient(135deg,'+COLORS[(i||0)%COLORS.length]+')';
const TYPES={page:['Page','#7c3aed'],assignment:['Assignment','#ea580c'],quiz:['Quiz','#2563eb'],discussion:['Discussion','#059669'],file:['File','#64748b'],link:['Link','#db2777']};
const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}):'';
const empty=(t,x,b)=>h('div',{class:'card empty'},h('b',{text:t}),x,b?h('div',{style:'margin-top:14px'},b):null);

let me=null,courses=[],enrAll=[],course=null,tab='modules';
let mods=[],items=[],enr=[],subs=[],anns=[];

/* ---------- sign in: handled by the Orchid login on index.html ---------- */
const showLogin=()=>location.replace('index.html');
const signOut=async()=>{await sb.auth.signOut();location.replace('index.html?logout=1')};

/* ---------- data ---------- */
async function loadCourses(){
  const [c,e]=await Promise.all([sb.from('ou_courses').select('*').order('created_at',{ascending:false}),sb.from('ou_enrollments').select('course_id')]);
  if(c.error)throw c.error;courses=c.data;enrAll=e.data||[];
}
async function loadCourse(){
  const id=course.id,q=t=>sb.from(t).select('*').eq('course_id',id);
  const r=await Promise.all([q('ou_modules').order('position'),q('ou_items').order('position'),q('ou_enrollments').order('email'),q('ou_submissions'),q('ou_announcements').order('created_at',{ascending:false})]);
  const bad=r.find(x=>x.error);if(bad)throw bad.error;
  [mods,items,enr,subs,anns]=r.map(x=>x.data);
}
async function run(p,msg){const r=await p;if(r.error)return fail(r.error);try{await loadCourses();if(course){course=courses.find(x=>x.id===course.id)||null;if(course)await loadCourse()}}catch(e){return fail(e)}if(msg)toast(msg);render()}

/* ---------- form modal ---------- */
function form({title,fields,values={},save='Save',onSave}){
  const els={};
  const body=fields.map(f=>{let el;
    if(f.t==='textarea')el=h('textarea',{});else if(f.t==='select')el=h('select',{},f.o.map(o=>h('option',{value:o[0],text:o[1]})));else el=h('input',{type:f.t||'text',placeholder:f.p||''});
    el.value=values[f.k]??f.d??'';els[f.k]=el;return h('label',{class:'f'},f.l,el)});
  const close=()=>ov.remove(),b=h('button',{class:'btn hot',text:save});
  b.onclick=async()=>{const v={};for(const f of fields){let x=els[f.k].value.trim();v[f.k]=x===''?null:(f.t==='number'?Number(x):x)}
    for(const f of fields)if(f.req&&v[f.k]==null){toast(f.l+' is required.');els[f.k].focus();return}
    b.disabled=true;await onSave(v);close()};
  const ov=h('div',{class:'ov',onclick:e=>{if(e.target===ov)close()}},h('div',{class:'md',role:'dialog','aria-modal':'true'},h('h2',{text:title}),body,h('div',{class:'acts'},h('button',{class:'btn ghost',text:'Cancel',onclick:close}),b)));
  document.body.append(ov);const f=ov.querySelector('input,textarea,select');f&&f.focus();
}

/* ---------- actions ---------- */
const courseF=()=>[{k:'title',l:'Course name',req:1,p:'e.g. Biology 101'},{k:'code',l:'Course code',p:'BIO101'},{k:'term',l:'Term',p:'Fall 2026'},{k:'color',l:'Color',t:'select',o:COLORS.map((c,i)=>[i,['Sunset','Orchid','Ocean','Meadow','Berry','Lagoon'][i]])},{k:'syllabus',l:'Description',t:'textarea',p:'What will students learn?'}];
const newCourse=()=>form({title:'New course',fields:courseF(),save:'Create course',onSave:v=>{v.color=+v.color||0;return run(sb.from('ou_courses').insert(v),'Course created. It stays hidden from students until you publish it.')}});
const toggleCourse=()=>run(sb.from('ou_courses').update({published:!course.published}).eq('id',course.id),course.published?'Unpublished.':'Published. Students can now see this course.');
const delCourse=async()=>{if(!confirm('Delete "'+course.title+'" and everything in it?'))return;const id=course.id;course=null;await run(sb.from('ou_courses').delete().eq('id',id),'Course deleted.')};
const pos=a=>a.length?Math.max(...a.map(x=>x.position||0))+1:0;
const newMod=()=>form({title:'New module',fields:[{k:'title',l:'Module name',req:1,p:'Week 1: Getting started'}],save:'Add module',onSave:v=>run(sb.from('ou_modules').insert({...v,course_id:course.id,position:pos(mods)}),'Module added.')});
const editMod=m=>form({title:'Rename module',fields:[{k:'title',l:'Module name',req:1}],values:m,onSave:v=>run(sb.from('ou_modules').update(v).eq('id',m.id),'Module saved.')});
const delMod=m=>confirm('Delete "'+m.title+'" and its items?')&&run(sb.from('ou_modules').delete().eq('id',m.id),'Module deleted.');
const pubMod=m=>run(sb.from('ou_modules').update({published:!m.published}).eq('id',m.id),m.published?'Module hidden.':'Module published.');
const itemF=()=>[{k:'type',l:'Type',t:'select',o:Object.entries(TYPES).map(([k,v])=>[k,v[0]])},{k:'title',l:'Title',req:1},{k:'body',l:'Instructions or content',t:'textarea'},{k:'url',l:'Link (video, file or website)',p:'https://'},{k:'points',l:'Points (assignments and quizzes)',t:'number'},{k:'due_date',l:'Due date',t:'date'}];
const newItem=m=>form({title:'Add to '+m.title,fields:itemF(),save:'Add item',onSave:v=>run(sb.from('ou_items').insert({...v,course_id:course.id,module_id:m.id,position:pos(items.filter(i=>i.module_id===m.id))}),'Item added.')});
const editItem=i=>form({title:'Edit item',fields:itemF(),values:i,onSave:v=>run(sb.from('ou_items').update(v).eq('id',i.id),'Item saved.')});
const delItem=i=>confirm('Delete "'+i.title+'"?')&&run(sb.from('ou_items').delete().eq('id',i.id),'Item deleted.');
const pubItem=i=>run(sb.from('ou_items').update({published:!i.published}).eq('id',i.id),i.published?'Item hidden.':'Item published.');
async function move(arr,i,d,table){const j=i+d;if(j<0||j>=arr.length)return;const a=arr[i],b=arr[j];
  await run(Promise.all([sb.from(table).update({position:j}).eq('id',a.id),sb.from(table).update({position:i}).eq('id',b.id)]).then(r=>r.find(x=>x.error)||{}))}
const newAnn=()=>form({title:'New announcement',fields:[{k:'title',l:'Headline',req:1},{k:'body',l:'Message',t:'textarea'}],save:'Post',onSave:v=>run(sb.from('ou_announcements').insert({...v,course_id:course.id}),'Announcement posted.')});
const addStudents=()=>form({title:'Add students',fields:[{k:'emails',l:'Student emails (one per line or comma separated)',t:'textarea',req:1}],save:'Enroll',onSave:v=>{
  const rows=[...new Set(v.emails.split(/[\s,;]+/).map(x=>x.toLowerCase()).filter(x=>x.includes('@')))].map(email=>({course_id:course.id,email}));
  return rows.length?run(sb.from('ou_enrollments').upsert(rows,{onConflict:'course_id,email'}),rows.length+' student'+(rows.length>1?'s':'')+' enrolled.'):toast('No valid emails found.')}});
const setScore=(email,it)=>{const cur=subs.find(s=>s.item_id===it.id&&s.student_email===email);
  const x=prompt('Score for '+email+' on "'+it.title+'"'+(it.points?' (out of '+it.points+')':'')+'. Leave empty to clear.',cur&&cur.score!=null?cur.score:'');if(x===null)return;
  const n=x.trim()===''?null:Number(x);if(n!==null&&isNaN(n))return toast('Enter a number.');
  run(sb.from('ou_submissions').upsert({course_id:course.id,item_id:it.id,student_email:email,score:n},{onConflict:'item_id,student_email'}),'Score saved.')};

/* ---------- AI check (teacher only; a signal, never proof) ---------- */
const AIL={likely_ai:['Likely AI','ai-hi'],unclear:['Unclear','ai-mid'],likely_human:['Likely human','ai-lo']};
async function aiCall(payload){const r=await sb.functions.invoke('ou-ai-check',{body:payload});
  if(r.error){let m='The AI check failed. Try again.';try{const j=await r.error.context.json();if(j&&j.error)m=j.error}catch(e){}throw new Error(m)}return r.data}
const aiBadge=s=>s.ai_verdict&&AIL[s.ai_verdict]?h('span',{class:'chip '+AIL[s.ai_verdict][1],title:s.ai_reasons||'',text:AIL[s.ai_verdict][0]+' · '+s.ai_score+'%'}):h('span',{class:'chip',text:'Not checked'});
const showAi=r=>{const l=AIL[r.verdict]||AIL.unclear,close=()=>ov.remove();
  const ov=h('div',{class:'ov',onclick:e=>{if(e.target===ov)close()}},h('div',{class:'md',role:'dialog','aria-modal':'true'},h('h2',{text:'AI check result'}),
    h('p',{},h('span',{class:'chip '+l[1],text:l[0]+' · '+r.score+'%'})),h('ul',{},(r.reasons||[]).map(x=>h('li',{text:x}))),
    h('p',{class:'muted',style:'font-size:.82rem',text:'This is a signal, not proof. AI detectors can be wrong, especially for students who write in a second language. Talk with the student before drawing any conclusion.'}),
    h('div',{class:'acts'},h('button',{class:'btn hot',text:'Close',onclick:close}))));document.body.append(ov)};
const checkSub=async s=>{toast('Checking…');try{await aiCall({submission_id:s.id});await run(Promise.resolve({}),'AI check saved.')}catch(e){fail(e)}};
const checkPasted=()=>form({title:'Check text for AI',fields:[{k:'text',l:'Paste the student\'s text (at least 80 words)',t:'textarea',req:1}],save:'Run check',onSave:async v=>{try{toast('Checking…');showAi(await aiCall({text:v.text}))}catch(e){fail(e)}}});
function vSubs(){const list=subs.filter(s=>s.body&&s.body.trim()).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  const head=h('div',{class:'hd'},h('div',{class:'sp'}),h('button',{class:'btn hot',text:'Check pasted text',onclick:checkPasted}));
  if(!list.length)return h('div',{},head,empty('No submissions yet','Written submissions from students will show up here with an AI check. You can already check any text by pasting it.'));
  return h('div',{},head,h('div',{class:'card'},list.map(s=>{const it=items.find(i=>i.id===s.item_id);
    return h('div',{class:'row',style:'align-items:flex-start'},h('div',{style:'flex:1;min-width:220px'},h('b',{text:s.student_email}),
      h('div',{class:'muted',style:'font-size:.82rem',text:(it?it.title+' · ':'')+new Date(s.created_at).toLocaleDateString()}),
      h('details',{style:'margin-top:6px'},h('summary',{text:'Read submission'}),h('p',{style:'white-space:pre-wrap',text:s.body}),s.ai_reasons?h('p',{class:'muted',style:'font-size:.85rem',text:'Why: '+s.ai_reasons}):null)),
      aiBadge(s),h('button',{class:'btn ghost sm',text:s.ai_verdict?'Re-check':'Check for AI',onclick:()=>checkSub(s)}))})))}

/* ---------- views ---------- */
const itemRow=(i,idx,arr)=>{const [n,c]=TYPES[i.type]||TYPES.page;
  return h('div',{class:'it'},h('span',{class:'ty',style:'background:'+c,text:n[0],title:n}),
   h('div',{class:'t'},h('b',{text:i.title}),h('small',{text:[n,i.points?i.points+' pts':'',i.due_date?'Due '+fmt(i.due_date):''].filter(Boolean).join(' · ')})),
   h('span',{class:'chip '+(i.published?'ok':'dr'),text:i.published?'Published':'Draft'}),
   h('button',{class:'btn ghost sm',text:i.published?'Hide':'Publish',onclick:()=>pubItem(i)}),
