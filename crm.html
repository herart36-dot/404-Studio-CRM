<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orchid Pals</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1fb;--card:#fff;--ink:#14122e;--muted:#64748b;--line:rgba(20,18,46,.09);--brand:#7c3aed;--grad:linear-gradient(135deg,#7c3aed,#d946ef);--glass:rgba(255,255,255,.62);--sh:0 10px 40px rgba(60,70,140,.10);--dark:#1b1a2e;--danger:#be123c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}html,body{margin:0;min-height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);line-height:1.5;background:radial-gradient(900px 520px at 6% 0%,#cfe3ff 0,transparent 60%),radial-gradient(800px 600px at 96% 8%,#ead7ff 0,transparent 55%),radial-gradient(900px 600px at 50% 100%,#c8f1e5 0,transparent 60%),#eef1fb;background-attachment:fixed}
button,input,textarea{font:inherit;color:inherit}[hidden]{display:none!important}
:focus-visible{outline:3px solid rgba(99,102,241,.45);outline-offset:2px}
.wm{font-weight:800;font-size:1.4rem;letter-spacing:-.03em;display:inline-flex;align-items:baseline;color:var(--ink)}
.wm b{color:#f97316;font-size:1.8em;line-height:.7;margin-right:1px}
.center{min-height:100vh;display:grid;place-items:center;padding:24px}
.panel,.card{background:var(--glass);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.85);border-radius:28px;box-shadow:var(--sh)}
.panel{padding:40px 32px;max-width:420px;width:100%;text-align:center}
.panel .wm{font-size:2rem;justify-content:center;margin-bottom:14px}
.panel h1{font-size:1.5rem;margin:0 0 8px}.panel p.sub{color:var(--muted);margin:0 0 24px}
.btn{border:0;cursor:pointer;border-radius:999px;padding:10px 20px;font-weight:700;font-size:.92rem;transition:transform .15s,box-shadow .15s,background .15s;display:inline-block}
.btn:active{transform:scale(.98)}
.primary{background:var(--dark);color:#fff;box-shadow:0 8px 20px rgba(20,18,46,.25)}
.ghost{background:#fff;border:1px solid #e2e8f0;color:var(--ink)}.ghost:hover{background:#f8fafc}
.wide{width:100%}
.field,input[type=text],input[type=email],input[type=password],textarea{width:100%;padding:10px 14px;border:1px solid #e2e8f0;border-radius:12px;background:rgba(255,255,255,.75)}
.field+.field,input+input{margin-top:10px}
textarea{resize:vertical;min-height:80px}
.show{display:flex;gap:6px;align-items:center;justify-content:flex-start;margin:8px 2px 0;color:var(--muted);font-size:.85rem}
.show input{width:auto;margin:0}
.lnk{display:inline-block;margin-top:18px;background:none;border:0;color:#475f8a;font-size:.88rem;text-decoration:underline;cursor:pointer}
.err{color:var(--danger);font-size:.9rem;margin-top:14px;min-height:0}
.or{color:var(--muted);font-size:.8rem;margin:16px 0;display:flex;align-items:center;gap:10px}.or:before,.or:after{content:"";flex:1;height:1px;background:rgba(20,18,46,.1)}
.soc{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px}
.soc b{font-size:1rem}
.note{font-size:.78rem;color:var(--muted);margin:14px 0 0}
.top{display:flex;align-items:center;gap:10px;padding:14px 22px}.top .wm{font-size:1.4rem}
.crmtag{font-size:.7rem;font-weight:800;letter-spacing:.12em;color:var(--muted);background:rgba(255,255,255,.7);padding:3px 10px;border-radius:999px}
.tabs{display:flex;gap:6px;width:max-content;max-width:calc(100% - 40px);margin:4px auto 0;background:var(--dark);border-radius:30px;padding:8px;box-shadow:0 14px 40px rgba(20,18,46,.35);overflow-x:auto}
.tab{border:0;background:none;cursor:pointer;padding:9px 18px;border-radius:999px;font-weight:700;color:#a9a8c4;white-space:nowrap}
.tab[aria-current=true]{background:#fff;color:var(--dark)}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
.card{padding:18px;margin-bottom:14px}
.av{width:40px;height:40px;border-radius:50%;background:var(--grad);color:#fff;font-weight:800;font-size:.8rem;display:grid;place-items:center;flex:none}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}.muted{color:var(--muted);font-size:.82rem}
.rec{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.dot{width:10px;height:10px;border-radius:50%;background:#ef4444;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.25}}
audio{width:100%;height:38px;margin-top:10px}
.reacts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.rx{border:1px solid #e2e8f0;background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:700;font-size:.9rem;display:flex;gap:6px;align-items:center;transition:transform .15s}
.rx:hover{transform:translateY(-2px)}.rx .e{font-size:1.2rem}
.rx.on{background:rgba(124,58,237,.1);border-color:var(--brand);color:var(--brand)}
.rx.pop .e{animation:pop .5s}@keyframes pop{30%{transform:scale(1.9) rotate(-12deg)}60%{transform:scale(.9) rotate(8deg)}}
.fly{position:fixed;pointer-events:none;font-size:1.6rem;animation:fly 1s ease-out forwards;z-index:70}
@keyframes fly{to{transform:translate(var(--dx),-120px) scale(1.4);opacity:0}}
.chatwrap{display:grid;grid-template-columns:210px 1fr;gap:14px}@media(max-width:600px){.chatwrap{grid-template-columns:1fr}}
.pl{display:flex;flex-direction:column;gap:4px}
.pi{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:14px;border:0;background:none;cursor:pointer;text-align:left;width:100%}
.pi:hover{background:rgba(255,255,255,.6)}.pi[aria-current=true]{background:rgba(124,58,237,.1)}
.msgs{height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px}
.m{max-width:80%;padding:8px 14px;border-radius:18px;background:#fff;align-self:flex-start;
