    h('button',{class:'btn ghost',text:'Message',onclick:()=>{chat=other(p);view='messages';render()}}),
    h('button',{class:'btn ghost',text:'Remove',onclick:()=>{if(confirm('Remove this Pal?'))palAction(()=>sb.from('pals').delete().eq('id',p.id))}}))));
  if(out.length)sec.push(h('div',{class:'card'},h('b',{text:'Waiting for a reply'}),out.map(p=>h('div',{class:'row',style:'margin-top:8px'},h('span',{class:'sp',text:nm(other(p))}),h('button',{class:'btn ghost',text:'Cancel',onclick:()=>palAction(()=>sb.from('pals').delete().eq('id',p.id))})))));
  return h('div',{},sec);
}
function adminCard(){
  const em=h('input',{type:'email',placeholder:'Email to approve',maxlength:'320'});
  const add=async()=>{const e=em.value.trim().toLowerCase();if(!validEmail(e))return toast('Please type a valid email.');const r=await sb.from('approved_emails').insert({email:e});if(r.error)return fail(r.error,r.error.code==='23505'?'That email is already approved.':'Could not approve.');await loadInvites();toast('Approved. They can now sign up.');render()};
  em.onkeydown=e=>{if(e.key==='Enter')add()};
  return h('div',{class:'card'},h('b',{text:'Admin: approved emails'}),h('p',{class:'muted',text:'Only approved emails can sign up for Orchid Pals.'}),
    h('div',{class:'cbar'},em,h('button',{class:'btn primary',text:'Approve',onclick:add})),
    invites.map(i=>h('div',{class:'row',style:'margin-top:10px'},h('span',{class:'sp',text:i.email}),i.is_admin?h('span',{class:'pill',text:'Admin'}):h('button',{class:'btn ghost',text:'Remove',onclick:async()=>{if(!confirm('Remove approval for '+i.email+'?'))return;const r=await sb.from('approved_emails').delete().eq('email',i.email);if(r.error)return fail(r.error);await loadInvites();render()}}))));
}
function appView(){
  const tabs=[['posts','Posts'],['messages','Messages'],['album','Album'],['pals','Pals']];
  const v={posts:postsView,messages:messagesView,album:albumView,pals:palsView}[view]();
  const inc=pals.filter(p=>p.status==='pending'&&p.addressee_id===me.id).length;
  return h('div',{},
    h('div',{class:'top'},h('div',{class:'wm'},h('b',{text:'O'}),'rchid\u00a0',h('span',{class:'lg',text:'Pals'})),h('span',{class:'sp'}),h('span',{class:'muted',text:me.name}),h('button',{class:'btn ghost',text:'Apps',onclick:home}),h('button',{class:'btn ghost',text:'Log out',onclick:logout})),
    h('nav',{class:'tabs'},tabs.map(([k,l])=>h('button',{class:'tab','aria-current':view===k,text:l+(k==='pals'&&inc?' ('+inc+')':''),onclick:()=>{if(rec)return;view=k;render()}}))),
    h('main',{},v));
}
function noAccess(){
  return h('div',{class:'center'},h('div',{class:'panel'},h('div',{class:'wm'},h('b',{text:'O'}),'rchid'),h('h1',{text:'No access'}),h('p',{class:'sub',text:'Your account could not be loaded. Please log out and log in again.'}),h('button',{class:'btn primary wide',text:'Back to sign in',onclick:logout})));
}
function render(){const a=$('#app');const y=window.scrollY;const keep=$('#msgin');if(keep)chatDraft=keep.value;a.replaceChildren(me?appView():noAccess());window.scrollTo(0,y)}
async function logout(){clearInterval(poll);try{await sb.auth.signOut()}catch(e){}out()}

/* ---------- start ---------- */
async function init(){
  $('#app').replaceChildren(h('div',{class:'center'},h('p',{class:'muted',text:'Loading…'})));
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return home();
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')out()});
  const pr=await sb.from('profiles').select('id,display_name,email').eq('id',session.user.id).maybeSingle();
  if(pr.error||!pr.data){me=null;return render()}
  me={id:pr.data.id,name:pr.data.display_name,email:pr.data.email};
  const ad=await sb.from('approved_emails').select('email,is_admin');isAdmin=!ad.error&&(ad.data||[]).length>0;
  try{await loadAll()}catch(e){fail(e,'Could not load your data. Please refresh.')}
  render();
  poll=setInterval(async()=>{if(document.hidden||rec||busy)return;try{if(view==='messages'){if(await loadMsgs()){render()}}else if(view==='pals'){const n=pals.length;await loadPeople();if(pals.length!==n)render()}}catch(e){}},6000);
}
init().catch(e=>{console.error(e);home()});
})();
</script>
