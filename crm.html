<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orchid CRM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1fb;--card:#fff;--ink:#14122e;--muted:#64748b;--line:rgba(20,18,46,.09);--brand:#2563eb;--grad:linear-gradient(135deg,#2563eb,#06b6d4);--glass:rgba(255,255,255,.66);--sh:0 10px 40px rgba(60,70,140,.10);--dark:#1b1a2e;--danger:#be123c;--ok:#047857;--warn:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}html,body{margin:0;min-height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);line-height:1.5;background:radial-gradient(900px 520px at 6% 0%,#cfe3ff 0,transparent 60%),radial-gradient(800px 600px at 96% 8%,#d3f3fb 0,transparent 55%),radial-gradient(900px 600px at 50% 100%,#c8f1e5 0,transparent 60%),#eef1fb;background-attachment:fixed}
button,input,textarea,select{font:inherit;color:inherit}[hidden]{display:none!important}
:focus-visible{outline:3px solid rgba(37,99,235,.45);outline-offset:2px}
.wm{font-weight:800;font-size:1.4rem;letter-spacing:-.03em;display:inline-flex;align-items:baseline}
.wm b{color:#f97316;font-size:1.8em;line-height:.7;margin-right:1px}
.wm .lg{font-size:.6em;font-weight:700;color:#6b7280;margin-left:.35em;letter-spacing:-.01em}
.center{min-height:100vh;display:grid;place-items:center;padding:24px}
.panel,.card{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.85);border-radius:24px;box-shadow:var(--sh)}
.panel{padding:40px 32px;max-width:420px;width:100%;text-align:center}
.panel h1{font-size:1.5rem;margin:12px 0 8px}.panel p.sub{color:var(--muted);margin:0 0 24px}
.muted{color:var(--muted)}
.btn{border:0;cursor:pointer;border-radius:999px;padding:9px 18px;font-weight:700;font-size:.9rem;transition:transform .15s,background .15s;display:inline-block}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.6;cursor:default}
.primary{background:var(--dark);color:#fff;box-shadow:0 8px 20px rgba(20,18,46,.22)}
.blue{background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(37,99,235,.28)}
.ghost{background:#fff;border:1px solid #e2e8f0}.ghost:hover{background:#f8fafc}
.danger{color:var(--danger)}
.sm{padding:6px 12px;font-size:.8rem}
.wide{width:100%}
input[type=text],input[type=email],input[type=tel],input[type=date],textarea,select{width:100%;padding:10px 14px;border:1px solid #e2e8f0;border-radius:12px;background:rgba(255,255,255,.85)}
textarea{resize:vertical;min-height:90px}
label.f{display:block;font-size:.82rem;font-weight:700;margin-top:12px}
label.f>*:last-child{margin-top:5px;font-weight:400}

/* layout */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(238,241,251,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1000px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sp{flex:1}
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:100%;padding:2px}
.tab{border:0;background:none;cursor:pointer;padding:8px 14px;border-radius:999px;font-weight:700;font-size:.88rem;color:var(--muted);white-space:nowrap}
.tab:hover{background:rgba(255,255,255,.7)}
.tab[aria-selected=true]{background:var(--dark);color:#fff}
.tab .n{margin-left:6px;font-size:.75rem;opacity:.8}
main{max-width:1000px;margin:0 auto;padding:22px 18px 80px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.bar input[type=text]{max-width:280px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid #e2e8f0;background:#fff;border-radius:999px;padding:5px 12px;font-size:.8rem;font-weight:700;cursor:pointer}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{padding:16px 18px}.stat .v{font-size:2rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}.stat .l{color:var(--muted);font-size:.85rem;font-weight:600}
.stat.hot .v{color:var(--danger)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.card{padding:16px 18px}
.card h3{margin:0 0 10px;font-size:1rem}
.list{display:flex;flex-direction:column;gap:10px}
.item{padding:14px 18px;display:flex;gap:12px;align-items:flex-start}
.item .body{flex:1;min-width:0}
.item .t{font-weight:700;overflow-wrap:anywhere}
.item .s{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.item .m{font-size:.9rem;margin-top:4px;overflow-wrap:anywhere;white-space:pre-wrap}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pill{display:inline-block;font-size:.72rem;font-weight:800;padding:2px 10px;border-radius:999px;background:#e2e8f0;vertical-align:middle;margin-left:6px}
.pill.new{background:#dbeafe;color:#1d4ed8}.pill.contacted{background:#fef3c7;color:#92400e}.pill.quoted{background:#ede9fe;color:#5b21b6}.pill.won{background:#d1fae5;color:#065f46}.pill.lost{background:#fee2e2;color:#991b1b}
.pill.high{background:#fee2e2;color:#991b1b}.pill.low{background:#f1f5f9;color:#475569}
.due{font-size:.82rem;font-weight:600;color:var(--muted)}.due.over{color:var(--danger)}.due.today{color:var(--warn)}
.chk{width:22px;height:22px;margin-top:2px;accent-color:var(--brand);flex:none;cursor:pointer}
.done .t{text-decoration:line-through;color:var(--muted)}
.pill.hot{background:#fee2e2;color:#991b1b}.pill.warm{background:#ffedd5;color:#9a3412}.pill.cool{background:#e0f2fe;color:#075985}
.next{padding:18px 22px;margin-bottom:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-left:6px solid #f97316}
.next .k{font-size:.82rem;font-weight:700;color:var(--muted)}.next .w{font-size:1.15rem;font-weight:800;letter-spacing:-.02em}
.empty{text-align:center;color:var(--muted);padding:36px 16px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.err{color:var(--danger);font-size:.88rem;margin-top:10px;min-height:1.2em}

/* cases */
.pill.open{background:#dbeafe;color:#1d4ed8}.pill.in_progress{background:#fef3c7;color:#92400e}.pill.waiting{background:#ede9fe;color:#5b21b6}.pill.resolved{background:#d1fae5;color:#065f46}.pill.closed{background:#e2e8f0;color:#475569}
.pill.urgent,.pill.esc{background:#991b1b;color:#fff}.pill.ch{background:#eef2ff;color:#3730a3}
.modal.wide{max-width:680px}
.tl{display:flex;flex-direction:column;gap:6px;margin:14px 0 10px;max-height:240px;overflow:auto}
.tl .n{padding:8px 12px;border-radius:12px;background:#f1f5f9;font-size:.88rem;overflow-wrap:anywhere;white-space:pre-wrap}
.tl .n.reply{background:#dbeafe}.tl .n.system{background:transparent;color:var(--muted);font-size:.8rem;padding:2px 12px}
.tl .who{font-size:.72rem;color:var(--muted);font-weight:700}
.sla-wrap{overflow-x:auto;margin:8px 0 4px}
.sla-grid{display:grid;grid-template-columns:70px repeat(3,minmax(70px,1fr)) minmax(150px,1.8fr);gap:8px;align-items:center;min-width:600px}
.sla-grid input{width:100%;padding:7px 10px;border:1px solid #e2e8f0;border-radius:10px;background:#fff}
.sec{margin:20px 0 4px;font-size:1rem}
.hint{color:var(--muted);font-size:.82rem;margin:0 0 6px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,18,46,.45);display:grid;place-items:center;padding:18px;z-index:50}
.modal{background:#fff;border-radius:24px;padding:24px;width:100%;max-width:460px;max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(20,18,46,.35)}
.modal h2{margin:0 0 4px;font-size:1.25rem}
.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 18px;border-radius:999px;z-index:99;font-size:.88rem;max-width:90%}

/* chat */
.chat{display:grid;grid-template-columns:300px minmax(0,1fr);height:calc(100vh - 150px);min-height:460px;max-height:780px;overflow:hidden;padding:0}
.chat-list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.chat-list .srch{padding:12px}
.chat-contacts{overflow:auto;flex:1;min-height:0}
.cc{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:10px 14px;cursor:pointer}
.cc:hover{background:rgba(255,255,255,.7)}.cc[aria-current=true]{background:#fff}
.cc .bd{flex:1;min-width:0}
.cc .nm{font-weight:700;display:flex;gap:8px;align-items:baseline}
.cc .nm span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc .tm{margin-left:auto;font-size:.72rem;color:var(--muted);font-weight:600;flex:none}
.cc .pv{color:var(--muted);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:38px;height:38px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.85rem;flex:none}
.av.inq{background:linear-gradient(135deg,#f97316,#f59e0b)}
.dot{min-width:20px;height:20px;border-radius:999px;background:#f97316;color:#fff;font-size:.72rem;font-weight:800;display:grid;place-items:center;padding:0 6px;flex:none}
.chat-pane{display:flex;flex-direction:column;min-height:0;min-width:0}
.chat-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chat-head .who{flex:1;min-width:140px}
.chat-head .who b{display:block;overflow-wrap:anywhere}.chat-head .who span{color:var(--muted);font-size:.82rem}
.chat-head a.btn{text-decoration:none;color:inherit}
.chat-msgs{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;min-height:0}
.day{align-self:center;font-size:.72rem;font-weight:700;color:var(--muted);margin:12px 0 2px}
.msg{display:flex;flex-direction:column;margin-top:6px}
.msg.out{align-items:flex-end}.msg.in{align-items:flex-start}
.bub{max-width:78%;padding:8px 13px;border-radius:18px;overflow-wrap:anywhere;white-space:pre-wrap;font-size:.92rem}
.msg.out .bub{background:var(--grad);color:#fff;border-bottom-right-radius:6px}
.msg.in .bub{background:#fff;border:1px solid #e2e8f0;border-bottom-left-radius:6px}
.msg .meta{font-size:.7rem;color:var(--muted);margin:2px 6px 0}
.msg .meta button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:.7rem;padding:0 0 0 6px;text-decoration:underline}
.chat-empty{margin:auto;text-align:center;color:var(--muted);padding:24px}
.composer{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.composer .r1{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;min-height:44px;max-height:140px;resize:none;border-radius:18px;padding:10px 14px}
.composer .btn{flex:none}
.composer .r0{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.composer .hint{margin:0}
.seg{display:inline-flex;background:#e2e8f0;border-radius:999px;padding:2px}
.seg button{border:0;background:none;cursor:pointer;border-radius:999px;padding:4px 12px;font-size:.78rem;font-weight:700;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(20,18,46,.15)}
.back{display:none}
@media(max-width:760px){
  .chat{grid-template-columns:1fr;height:calc(100dvh - 190px)}
  .chat .chat-pane{display:none}.chat.open .chat-pane{display:flex}.chat.open .chat-list{display:none}
  .back{display:inline-block}
  .chat-head{padding:10px 12px;gap:8px}.chat-head .who{min-width:0}.chat-head .who span{display:none}
  .bub{max-width:88%}
}
@media(prefers-reduced-motion:no-preference){.scrim{animation:fade .15s}@keyframes fade{from{opacity:0}}}
@media(max-width:760px){
  html,body{width:100%;overflow-x:hidden}
  body{font-size:15px}
  .top{position:sticky;top:0}
  .top-in{width:100%;max-width:none;padding:10px 12px;gap:8px;align-items:center}
  .top-in>.wm{flex:none}
  .top-in>.sp{display:none}
  .top-in>.muted{display:none}
  .top-in>.btn{flex:none;padding:7px 11px;font-size:.78rem}
  .top-in>.tabs{order:10;width:100%;flex:0 0 100%;margin:0 -2px;padding:2px 0 3px;scrollbar-width:none}
  .top-in>.tabs::-webkit-scrollbar{display:none}
  .tab{padding:8px 12px;font-size:.8rem}
  main{width:100%;padding:14px 12px 70px}
  .bar{gap:7px;margin-bottom:12px}
  .bar input[type=text]{width:100%;max-width:none;flex:1 1 100%;font-size:16px}
  .bar .sp{display:none}
  .bar>.btn{flex:0 0 auto}
  .chips{width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;padding:7px 12px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}
  .stat{padding:13px 12px;border-radius:18px}
  .stat .v{font-size:1.55rem}
  .stat .l{font-size:.75rem;line-height:1.25}
  .card{border-radius:18px}
  .item{padding:13px 14px;gap:9px;display:block}
  .item .acts{margin-top:10px}
  .acts{gap:6px}
  .acts .btn{min-height:36px}
  .btn{min-height:40px;padding:9px 14px}
  .btn.sm{min-height:34px;padding:7px 11px}
  input[type=text],input[type=email],input[type=tel],input[type=date],textarea,select{font-size:16px;min-height:42px}
  textarea{min-height:100px}
  .panel{padding:28px 20px;border-radius:20px}
  .modal{padding:20px 16px;border-radius:20px;max-height:90dvh}
  .modal .row{position:sticky;bottom:-20px;background:#fff;padding-top:12px;padding-bottom:2px;margin-left:-2px;margin-right:-2px}
  .modal .row .btn{flex:1}
  .next{padding:14px 15px;margin-bottom:12px;gap:10px}
  .next .w{font-size:1rem}
  .grid2{grid-template-columns:1fr;gap:12px}
  .list{gap:8px}
  .due{font-size:.78rem}
  .pill{font-size:.68rem;padding:2px 8px}
  .toast{bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:.82rem}
  .chat{height:calc(100dvh - 170px);min-height:420px;border-radius:18px}
  .chat-list .srch{padding:10px}
  .cc{padding:10px 11px}
  .chat-head{padding:10px}
  .chat-head .who{min-width:0;max-width:calc(100% - 110px)}
  .chat-head .who b{font-size:.9rem}
  .chat-head a.btn,.chat-head>.btn:not(.back){padding:7px 9px;font-size:.75rem}
  .composer{padding:8px}
  .composer .r0{gap:6px}
  .composer .hint{font-size:.7rem}
  .composer .r1{gap:6px}
  .composer textarea{font-size:16px;min-height:44px}
  .composer .btn{min-width:72px}
  .bub{max-width:90%;font-size:.88rem}
  .sla-wrap{margin-left:-4px;margin-right:-4px}
}
@media(max-width:420px){
  .wm{font-size:1.15rem}
  .wm b{font-size:1.55em}
  .wm .lg{font-size:.55em}
  .top-in>.btn{padding:6px 9px;font-size:.72rem}
  .tab{padding:7px 10px;font-size:.76rem}
  .stats{gap:7px}
  .stat .v{font-size:1.4rem}
  .bar>.btn{width:100%}
  .bar .chips+.sp+.btn{width:100%}
  .next{display:block}
  .next .btn{margin-top:10px;width:100%}
  .acts .btn{flex:1 1 auto}
  .chat-head .who{max-width:calc(100% - 85px)}
}


/* ===== MOBILE POLISH ===== */
@media (max-width: 600px){
  :root{--sh:0 6px 24px rgba(60,70,140,.08)}
  html,body{min-width:0;width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
  body{font-size:14px;padding:0}
  .top{position:sticky;top:0;z-index:100;background:rgba(238,241,251,.94);box-shadow:0 1px 0 rgba(20,18,46,.06)}
  .top-in{display:grid;grid-template-columns:1fr auto auto;grid-template-areas:'brand apps logout' 'tabs tabs tabs';width:100%;padding:10px 12px 7px;gap:8px 6px}
  .top-in>.wm{grid-area:brand;font-size:1.15rem;align-self:center}
  .top-in>.btn:nth-last-child(2){grid-area:apps}
  .top-in>.btn:last-child{grid-area:logout}
  .top-in>.sp,.top-in>.muted{display:none!important}
  .top-in>.btn{min-height:34px;padding:6px 10px;border-radius:10px;font-size:.74rem;box-shadow:none}
  .top-in>.tabs{grid-area:tabs;width:calc(100% + 0px);min-width:0;display:flex;gap:5px;overflow-x:auto;overscroll-behavior-x:contain;padding:2px 0 4px;scrollbar-width:none}
  .top-in>.tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:7px 12px;border-radius:999px;font-size:.76rem;line-height:1;min-height:32px}
  main{width:100%;max-width:none;margin:0;padding:14px 11px calc(80px + env(safe-area-inset-bottom,0px))}
  .bar{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px;align-items:center}
  .bar>h3,.bar>div:first-child:not(.sp){min-width:0}
  .bar input[type=text]{grid-column:1/-1;width:100%;max-width:none;min-width:0;margin:0;font-size:16px}
  .bar .sp{display:none}
  .bar>.btn{width:auto;min-width:0}
  .bar .chips{grid-column:1/-1;width:100%;min-width:0}
  .chips{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;scrollbar-width:none;padding:1px 1px 4px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;white-space:nowrap;padding:7px 11px;font-size:.74rem}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 0 14px}
  .stat{padding:13px 12px;border-radius:18px;min-width:0}
  .stat .v{font-size:1.45rem;overflow:hidden;text-overflow:ellipsis}
  .stat .l{font-size:.72rem}
  .card{border-radius:18px}
  .next{display:block;padding:15px;margin-bottom:13px;border-left-width:4px}
  .next .k{font-size:.72rem}
  .next .w{font-size:.98rem;margin-top:3px}
  .next .btn{width:100%;margin-top:11px}
  .grid2{display:block}
  .grid2>div+div{margin-top:12px}
  .item{display:block;padding:14px;border-radius:17px}
  .item .body{min-width:0}
  .item .t{font-size:.94rem;line-height:1.35}
  .item .s{font-size:.78rem;line-height:1.45}
  .item .m{font-size:.84rem}
  .acts{display:flex;gap:6px;flex-wrap:wrap}
  .acts .btn{flex:1 1 auto;min-width:0;min-height:36px;padding:7px 9px;font-size:.75rem}
  .btn{min-height:40px;padding:9px 13px;border-radius:12px}
  .btn.sm{min-height:34px;padding:7px 10px;border-radius:10px}
  input[type=text],input[type=email],input[type=tel],input[type=date],textarea,select{font-size:16px;min-height:44px}
  .modal{width:min(100%,430px);max-height:calc(100dvh - 24px);border-radius:22px;padding:19px 15px}
  .modal h2{font-size:1.12rem}
  .modal .row{display:flex;position:sticky;bottom:-19px;margin:16px -1px -2px;padding:12px 0 2px;background:#fff}
  .modal .row .btn{flex:1}
  .scrim{padding:12px}
  .empty{padding:28px 14px}
  .toast{max-width:calc(100% - 24px);text-align:center}

  /* Mobile chat becomes a clean full-width screen */
  .chat{display:block;width:100%;height:calc(100dvh - 132px);min-height:0;max-height:none;border-radius:18px;overflow:hidden}
  .chat-list{height:100%;border-right:0}
  .chat.open .chat-list{display:none}
  .chat.open .chat-pane{display:flex;height:100%}
  .chat-list .srch{padding:10px}
  .chat-list .srch input{font-size:16px}
  .cc{padding:11px 12px}
  .cc .pv{font-size:.77rem}
  .chat-head{padding:10px 9px;min-height:58px;gap:7px;flex-wrap:nowrap}
  .chat-head .who{flex:1;min-width:0;max-width:none}

<script>
(function(){
/* ---- CRM Supabase project (same one the login page uses) ---- */
const SB_URL='https://acxrobzulaswsubfoghg.supabase.co';
const SB_KEY='sb_publishable_3Ehkqe8QtPVJQoh4FCZIVg_m2f8SOTD';

const $=s=>document.querySelector(s);

const STATUSES=['new','contacted','quoted','won','lost'];
const PRIORITIES=['low','normal','high'];

let me=null,clients=[],inquiries=[],tasks=[],members=[],staff=[],isAdmin=false,staffErr=false;
const ADMIN_EMAIL='keandonato@404studio.click';
const taskAssignments=()=>JSON.parse(localStorage.getItem('orchid_crm_task_assignments')||'{}');
const saveTaskAssignment=(id,email)=>{const a=taskAssignments();if(email)a[id]=email;else delete a[id];localStorage.setItem('orchid_crm_task_assignments',JSON.stringify(a))};
let cases=[],policies=[],rules=[],casesErr=false,caseFilter='all';
let view='overview',q='',inqFilter='all',taskFilter='open';
let chatMsgs=[],chatErr=false,chatSel=null,chatOpen=false,chatMode='out',chatQ='',chatSub=null;const chatDrafts={};
caseFilter='active';

/* ---- tiny DOM helper (text is always set as text, never HTML) ---- */
const h=(t,a={},...c)=>{const el=document.createElement(t);for(const k in a){if(k==='text')el.textContent=a[k];else if(k.startsWith('on'))el.addEventListener(k.slice(2),a[k]);else if(a[k]===true)el.setAttribute(k,'');else if(a[k]!==false&&a[k]!=null)el.setAttribute(k,a[k])}c.flat().forEach(x=>x!=null&&x!==false&&el.append(x.nodeType?x:document.createTextNode(x)));return el};
function toast(t){const el=h('div',{class:'toast',text:t,role:'status'});document.body.append(el);setTimeout(()=>el.remove(),3000)}
const fail=(e,m)=>{console.error(e);toast(m||'Something went wrong. Please try again.')};
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtDate=d=>d?new Date(d+'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'';
const ago=t=>{const m=Math.floor((Date.now()-new Date(t))/6e4);return m<1?'just now':m<60?m+'m ago':m<1440?Math.floor(m/60)+'h ago':Math.floor(m/1440)+'d ago'};

const match=(o,keys)=>!q||keys.some(k=>String(o[k]||'').toLowerCase().includes(q.toLowerCase()));
const nullify=o=>{for(const k in o)if(typeof o[k]==='string'){o[k]=o[k].trim();if(o[k]==='')o[k]=null}return o};

/* ---- data ---- */
async function loadAll(){

  ]);

  members=[{name:'Admin',email:ADMIN_EMAIL,role:'admin'},...staff.filter(x=>x.active).map(x=>({name:x.name||x.email,email:x.email,role:'staff'}))];
}
async function run(p,okMsg){const r=await p;if(r.error)return fail(r.error);try{await loadAll()}catch(e){return fail(e,'Saved, but could not refresh. Please reload.')}if(okMsg)toast(okMsg);render()}

/* ---- modal form ---- */
function openForm({title,fields,values={},saveText='Save changes',onSave}){
  const inputs={};
  const form=h('div',{},...fields.map(f=>{
    let el;
    if(f.type==='textarea')el=h('textarea',{id:'f_'+f.k});
    else if(f.type==='select'){el=h('select',{id:'f_'+f.k},...f.options.map(o=>h('option',{value:o.v,text:o.t})))}
    else el=h('input',{id:'f_'+f.k,type:f.type||'text'});
    if(f.type!=='select'&&f.type!=='textarea'&&f.placeholder)el.placeholder=f.placeholder;
    el.value=values[f.k]??f.def??'';
    inputs[f.k]=el;
    return h('label',{class:'f',for:'f_'+f.k},f.label,el);
  }));
  const err=h('div',{class:'err',role:'alert'});
  const close=()=>{scrim.remove();document.removeEventListener('keydown',esc)};
  const esc=e=>{if(e.key==='Escape')close()};
  const save=h('button',{class:'btn blue',text:saveText,onclick:async()=>{
    const out={};for(const f of fields){out[f.k]=inputs[f.k].value;if(f.req&&!out[f.k].trim()){err.textContent=f.label+' is required.';inputs[f.k].focus();return}
      if(f.type==='email'&&out[f.k].trim()&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(out[f.k].trim())){err.textContent='Enter a valid email address.';inputs[f.k].focus();return}}
    save.disabled=true;try{await onSave(nullify(out));close()}finally{save.disabled=false}
  }});
  const scrim=h('div',{class:'scrim',onclick:e=>{if(e.target===scrim)close()}},
    h('div',{class:'modal',role:'dialog','aria-modal':'true','aria-label':title},
      h('h2',{text:title}),form,err,
      h('div',{class:'row'},h('button',{class:'btn ghost',text:'Cancel',onclick:close}),save)));
  document.body.append(scrim);document.addEventListener('keydown',esc);
  const first=scrim.querySelector('input,textarea,select');first&&first.focus();
}
const clientOptions=()=>[{v:'',t:'No client'},...clients.map(c=>({v:c.id,t:c.name}))];

/* ---- inquiries ---- */
const inqFields=()=>[
  {k:'name',label:'Name',req:true},
  {k:'email',label:'Email',type:'email'},
  {k:'phone',label:'Phone',type:'tel'},
  {k:'source',label:'Where it came from',placeholder:'Website, referral, Instagram…'},
  {k:'status',label:'Status',type:'select',options:STATUSES.map(s=>({v:s,t:cap(s)})),def:'new'},
  {k:'message',label:'What they asked for',type:'textarea'}
];
const addInquiry=()=>openForm({title:'New inquiry',fields:inqFields(),saveText:'Add inquiry',onSave:v=>run(sb.from('crm_inquiries').insert(v),'Inquiry added.')});
const editInquiry=i=>openForm({title:'Edit inquiry',fields:inqFields(),values:i,onSave:v=>run(sb.from('crm_inquiries').update({...v,...touchPatch(i,v.status||i.status)}).eq('id',i.id),'Inquiry saved.')});
const nowIso=()=>new Date().toISOString();
const dur=ms=>{const m=Math.round(ms/6e4);return m<60?Math.max(m,1)+'m':m<2880?Math.round(m/60)+'h':Math.round(m/1440)+'d'};
const waitMs=i=>Date.now()-new Date(i.created_at);
const idleDays=i=>(Date.now()-new Date(i.last_touch||i.created_at))/864e5;
const touchPatch=(i,s)=>({status:s,last_touch:nowIso(),...(s!=='new'&&!i.contacted_at?{contacted_at:nowIso()}:{})});
const setStatus=(i,s)=>run(sb.from('crm_inquiries').update(touchPatch(i,s)).eq('id',i.id));
const logTouch=i=>run(sb.from('crm_inquiries').update({last_touch:nowIso()}).eq('id',i.id),'Touch logged. The clock restarts.');
const isActive=i=>i.status==='contacted'||i.status==='quoted';
const chatNote=f=>chatMsgs.some(f)?' Their chat history is deleted too.':'';
const delInquiry=i=>{if(confirm('Delete the inquiry from '+i.name+'?'+chatNote(m=>m.inquiry_id===i.id)))run(sb.from('crm_inquiries').delete().eq('id',i.id),'Inquiry deleted.')};
async function convert(i){
  const ex=i.email&&clients.find(c=>(c.email||'').toLowerCase()===i.email.toLowerCase());
  let cid=ex&&ex.id;
  if(!cid){
    const r=await sb.from('crm_clients').insert({name:i.name,email:i.email,phone:i.phone,notes:i.message}).select('id').single();
    if(r.error)return fail(r.error);cid=r.data.id;
  }
  await run(sb.from('crm_inquiries').update({client_id:cid,...touchPatch(i,i.status==='lost'?'lost':'won')}).eq('id',i.id),ex?'Linked to existing client.':'Client created.');
}

/* ---- clients ---- */
const clientFields=()=>[
  {k:'name',label:'Name',req:true},
  {k:'company',label:'Company'},
  {k:'email',label:'Email',type:'email'},
  {k:'phone',label:'Phone',type:'tel'},
  {k:'notes',label:'Notes',type:'textarea'}
];
const addClient=()=>openForm({title:'New client',fields:clientFields(),saveText:'Add client',onSave:v=>run(sb.from('crm_clients').insert(v),'Client added.')});
const editClient=c=>openForm({title:'Edit client',fields:clientFields(),values:c,onSave:v=>run(sb.from('crm_clients').update(v).eq('id',c.id),'Client saved.')});
const delClient=c=>{if(confirm('Delete '+c.name+'? Their inquiries and tasks stay, but are unlinked.'+chatNote(m=>m.client_id===c.id)))run(sb.from('crm_clients').delete().eq('id',c.id),'Client deleted.')};

/* ---- tasks ---- */
const memberOptions=()=>[{v:'',t:'Unassigned'},...members.map(m=>({v:m.email,t:m.name+' · '+m.email}))];
const taskFields=()=>[
  {k:'title',label:'Task',req:true},
  {k:'assigned_to',label:'Assign to member',type:'select',options:memberOptions(),def:''},
  {k:'due_date',label:'Due date',type:'date'},
  {k:'priority',label:'Priority',type:'select',options:PRIORITIES.map(p=>({v:p,t:cap(p)})),def:'normal'},
  {k:'client_id',label:'Client',type:'select',options:clientOptions()}
];
const addTask=(client_id)=>openForm({title:'New task',fields:taskFields(),values:{client_id:client_id||'',assigned_to:''},saveText:'Add task',onSave:async v=>{const assigned=v.assigned_to||'';delete v.assigned_to;const r=await sb.from('crm_tasks').insert(v).select().single();if(r.error)return fail(r.error);saveTaskAssignment(r.data.id,assigned);await loadAll();toast('Task added.');render()}});
const editTask=t=>openForm({title:'Edit task',fields:taskFields(),values:{...t,assigned_to:t.assigned_to||'',client_id:t.client_id||'',due_date:t.due_date||''},onSave:async v=>{const assigned=v.assigned_to||'';delete v.assigned_to;const r=await sb.from('crm_tasks').update(v).eq('id',t.id);if(r.error)return fail(r.error);saveTaskAssignment(t.id,assigned);await loadAll();toast('Task saved.');render()}});
const toggleTask=t=>run(sb.from('crm_tasks').update({done:!t.done}).eq('id',t.id));
const delTask=t=>{if(confirm('Delete this task?'))run(sb.from('crm_tasks').delete().eq('id',t.id),'Task deleted.')};
const memberName=email=>{const m=members.find(x=>(x.email||'').toLowerCase()===(email||'').toLowerCase());return m?(m.name||m.email):email||''};

/* ---- shared pieces ---- */
const isOverdue=t=>!t.done&&t.due_date&&t.due_date<today();
const empty=(title,text,btn)=>h('div',{class:'card empty'},h('b',{text:title}),text,btn?h('div',{style:'margin-top:14px'},btn):null);
const searchBar=(ph)=>{const i=h('input',{type:'text',placeholder:ph,value:q,'aria-label':ph,oninput:e=>{q=e.target.value;const pos=e.target.selectionStart;render();const n=$('#search');if(n){n.focus();n.setSelectionRange(pos,pos)}}});i.id='search';return i};
const chips=(opts,cur,set)=>h('div',{class:'chips'},opts.map(([v,t])=>h('button',{class:'chip','aria-pressed':String(cur===v),text:t,onclick:()=>{set(v);render()}})));
function dueEl(t){if(!t.due_date)return null;const o=isOverdue(t),td=!t.done&&t.due_date===today();return h('span',{class:'due'+(o?' over':td?' today':''),text:(o?'Overdue · ':td?'Due today · ':'Due ')+fmtDate(t.due_date)})}

function taskRow(t){
  return h('div',{class:'card item'+(t.done?' done':'')},
    h('input',{type:'checkbox',class:'chk',checked:t.done,'aria-label':'Mark done: '+t.title,onchange:()=>toggleTask(t)}),
    h('div',{class:'body'},
      h('div',{class:'t'},t.title,t.priority!=='normal'?h('span',{class:'pill '+t.priority,text:cap(t.priority)}):null),
      h('div',{class:'s'},dueEl(t),t.assigned_to?h('span',{text:(t.due_date?' · ':'')+'Assigned to '+memberName(t.assigned_to)}):h('span',{text:(t.due_date?' · ':'')+'Unassigned'}),t.client_id?h('span',{text:' · '+clientName(t.client_id)}):null),
      h('div',{class:'acts'},h('button',{class:'btn ghost sm',text:'Edit',onclick:()=>editTask(t)}),h('button',{class:'btn ghost sm danger',text:'Delete',onclick:()=>delTask(t)}))));
}
function signal(i){
  if(i.status==='new'){const h1=waitMs(i)/36e5;return h('span',{class:'pill '+(h1>24?'hot':h1>4?'warm':'cool'),text:'Waiting '+dur(waitMs(i))})}
  if(isActive(i)&&idleDays(i)>=5)return h('span',{class:'pill '+(idleDays(i)>=10?'hot':'warm'),text:'Going cold · '+Math.floor(idleDays(i))+'d quiet'});
  if(i.status==='lost'&&idleDays(i)>=30)return h('span',{class:'pill cool',text:'Worth revisiting'});
  return null;
}
function inquiryRow(i){
  const sel=h('select',{'aria-label':'Status for '+i.name,style:'width:auto;padding:6px 10px;border-radius:999px;font-size:.8rem;font-weight:700',onchange:e=>setStatus(i,e.target.value)},STATUSES.map(s=>h('option',{value:s,text:cap(s)})));

/* ---- cases: emails, chats and calls become tickets, with routing, SLA clocks and escalation ---- */
const CASE_STATUSES=['open','in_progress','waiting','resolved','closed'];
const CASE_PRIO=['low','normal','high','urgent'];
const PRANK={low:0,normal:1,high:2,urgent:3};
const CHANNELS=[['email','Email'],['chat','Chat'],['call','Call'],['web','Website'],['other','Other']];
const caseFilters=[['active','Active'],['breached','SLA breached'],['mine','Mine'],['unassigned','Unassigned'],['resolved','Resolved'],['all','All']];
const stLabel=s=>s==='in_progress'?'In progress':cap(s);
const chLabel=c=>(CHANNELS.find(x=>x[0]===c)||[c,cap(c)])[1];
const caseNo=c=>'CS-'+String(c.number).padStart(4,'0');
const isLive=c=>c.status==='open'||c.status==='in_progress'||c.status==='waiting';
const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
function sla(c){
  const t=Date.now();
  if(c.status==='resolved'||c.status==='closed'){const late=c.resolved_at&&c.resolve_due_at&&new Date(c.resolved_at)>new Date(c.resolve_due_at);return{t:late?'Resolved late':'Resolved within SLA',cls:late?'warm':'cool',breach:false}}
  if(c.status==='waiting')return{t:'SLA paused · waiting on customer',cls:'cool',breach:false};
  const rd=c.response_due_at&&new Date(c.response_due_at),sd=c.resolve_due_at&&new Date(c.resolve_due_at);
  if(!c.first_response_at&&rd&&rd<t)return{t:'Reply overdue by '+dur(t-rd),cls:'hot',breach:true};
  if(sd&&sd<t)return{t:'Resolution overdue by '+dur(t-sd),cls:'hot',breach:true};
  if(!c.first_response_at&&rd){const left=rd-t,tot=rd-new Date(c.created_at);return{t:'Reply due in '+dur(left),cls:left<tot*.25?'warm':'cool',breach:false}}
  if(sd){const left=sd-t,tot=sd-new Date(c.created_at);return{t:'Resolve in '+dur(left),cls:left<tot*.25?'warm':'cool',breach:false}}
  return{t:'No SLA',cls:'cool',breach:false};
}
const caseFields=()=>[
  {k:'subject',label:'What is the issue?',req:true},
  {k:'channel',label:'Where did it come from?',type:'select',options:CHANNELS.map(([v,t])=>({v,t})),def:'email'},

  {k:'client_id',label:'Client',type:'select',options:clientOptions()},
  {k:'description',label:'Details',type:'textarea'}
];

/* ---- chat: a shared conversation log with each person in the CRM ---- */
const mobile=()=>matchMedia('(max-width:760px)').matches;
const seenKey=()=>'orchid_chat_seen_'+(me?me.id:'');
const seenGet=()=>{try{return JSON.parse(localStorage.getItem(seenKey())||'{}')}catch(e){return{}}};
const initials=n=>(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
const hm=t=>new Date(t).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
const dayKey=t=>new Date(t).toDateString();
const dayLabel=t=>{const d=new Date(t),n=new Date();if(dayKey(t)===n.toDateString())return'Today';if(dayKey(t)===new Date(Date.now()-864e5).toDateString())return'Yesterday';return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:d.getFullYear()===n.getFullYear()?undefined:'numeric'})};
const listTime=t=>dayKey(t)===new Date().toDateString()?hm(t):new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const whoIs=a=>!a?'':a.toLowerCase()===me.email.toLowerCase()?'You':a.split('@')[0];

async function loadChat(){
  const r=await sb.from('crm_chat_messages').select('*').order('created_at',{ascending:false}).limit(1500);
  if(r.error){chatErr=true;chatMsgs=[];return}
  chatErr=false;chatMsgs=r.data.reverse();
}
function chatContacts(){
  const iq=new Map(inquiries.map(i=>[i.id,i])),g=new Map();
  for(const m of chatMsgs){
    const i=m.inquiry_id&&iq.get(m.inquiry_id);
    const k=m.client_id?'c:'+m.client_id:i&&i.client_id?'c:'+i.client_id:'i:'+m.inquiry_id;
    if(!g.has(k))g.set(k,[]);g.get(k).push(m);
  }
  const seen=seenGet();
  const mk=(key,type,rec,sub)=>{const ms=g.get(key)||[],s=seen[key]?new Date(seen[key]):0;
    return{key,type,rec,name:rec.name,sub,ms,last:ms[ms.length-1],unread:ms.filter(m=>m.direction==='in'&&new Date(m.created_at)>s).length}};
  return[...clients.map(c=>mk('c:'+c.id,'client',c,c.company||c.email||c.phone||'')),
    ...inquiries.filter(i=>!i.client_id).map(i=>mk('i:'+i.id,'inquiry',i,'Inquiry · '+cap(i.status)))]
    .sort((a,b)=>(b.last?new Date(b.last.created_at):0)-(a.last?new Date(a.last.created_at):0)||a.name.localeCompare(b.name));
}
const chatUnread=()=>chatErr?0:chatContacts().reduce((a,c)=>a+c.unread,0);
function markSeen(k){
  const c=chatContacts().find(x=>x.key===k);if(!c)return;
  const li=[...c.ms].reverse().find(m=>m.direction==='in');if(!li)return;
  try{const s=seenGet();s[k]=li.created_at;localStorage.setItem(seenKey(),JSON.stringify(s))}catch(e){}
}
function updateChatBadge(){
  const b=$('#tab_chat');if(!b)return;const n=chatUnread();let s=b.querySelector('.n');
  if(!n){s&&s.remove();return}
  if(!s){s=h('span',{class:'n'});b.append(s)}s.textContent=String(n);
}
const chatBtn=k=>chatErr?null:h('button',{class:'btn ghost sm',text:'Chat',onclick:()=>openChat(k)});
function openChat(k){view='chat';q='';chatSel=k;chatOpen=true;markSeen(k);render();window.scrollTo(0,0)}

function addMsg(m){
  if(chatMsgs.some(x=>x.id===m.id))return;
  chatMsgs.push(m);chatMsgs.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));onChatChange();
}
function onChatChange(){
  if(view==='chat'){
    if(chatSel&&(!mobile()||chatOpen))markSeen(chatSel);
    paintList();paintMsgs();
  }else updateChatBadge();
}
async function pollChat(){
  if(chatErr||!me)return;
  const last=chatMsgs.length?chatMsgs[chatMsgs.length-1].created_at:null;
  let r=sb.from('crm_chat_messages').select('*').order('created_at',{ascending:true}).limit(200);
  if(last)r=r.gt('created_at',last);
  const x=await r;if(x.error)return;
  let ch=false;for(const m of x.data)if(!chatMsgs.some(y=>y.id===m.id)){chatMsgs.push(m);ch=true}
  if(ch)onChatChange();
}
function subChat(){
  if(chatSub||chatErr)return;
  try{chatSub=sb.channel('crm-chat').on('postgres_changes',{event:'*',schema:'public',table:'crm_chat_messages'},p=>{
    if(p.eventType==='INSERT')addMsg(p.new);
    else if(p.eventType==='DELETE'){chatMsgs=chatMsgs.filter(m=>m.id!==p.old.id);onChatChange()}
  }).subscribe()}catch(e){console.error(e)}
}

function contactRow(c){
  const pv=c.last?(c.last.direction==='out'?'You: ':'')+c.last.body.replace(/\s+/g,' '):(c.sub||'No messages yet');
  return h('button',{class:'cc','aria-current':String(chatSel===c.key),onclick:()=>{chatSel=c.key;chatOpen=true;markSeen(c.key);paintList();paintPane()}},
    h('div',{class:'av'+(c.type==='inquiry'?' inq':''),text:initials(c.name),'aria-hidden':'true'}),
    h('div',{class:'bd'},h('div',{class:'nm'},h('span',{text:c.name}),c.last?h('span',{class:'tm',text:listTime(c.last.created_at)}):null),
      h('div',{class:'pv',text:pv})),
    c.unread?h('span',{class:'dot',text:String(c.unread),'aria-label':c.unread+' unread'}):null);
}
function paintList(){
  const box=$('#chat-contacts');if(!box)return;
  const cs=chatContacts().filter(c=>!chatQ||(c.name+' '+c.sub).toLowerCase().includes(chatQ.toLowerCase()));
  box.replaceChildren(...(cs.length?cs.map(contactRow):[h('div',{class:'empty',text:'No matches'})]));
  updateChatBadge();
}
function paintMsgs(forceBottom){
  const el=$('#chat-msgs');if(!el)return;
  const c=chatContacts().find(x=>x.key===chatSel);if(!c)return;
  const atBottom=forceBottom||el.scrollHeight-el.scrollTop-el.clientHeight<80;
  let prev=null;const rows=[];
  for(const m of c.ms){
    if(dayKey(m.created_at)!==prev){prev=dayKey(m.created_at);rows.push(h('div',{class:'day',text:dayLabel(m.created_at)}))}
    const mine=m.author&&m.author.toLowerCase()===me.email.toLowerCase();
    rows.push(h('div',{class:'msg '+m.direction},h('div',{class:'bub',text:m.body}),
      h('div',{class:'meta'},hm(m.created_at)+(m.direction==='out'?' · '+whoIs(m.author):' · logged by '+whoIs(m.author)),
        mine?h('button',{type:'button',text:'Delete',onclick:()=>delMsg(m)}):null)));
  }
  el.replaceChildren(...(rows.length?rows:[h('div',{class:'chat-empty',text:'No messages yet. Start the conversation below.'})]));
  if(atBottom)el.scrollTop=el.scrollHeight;
}
async function delMsg(m){
  if(!confirm('Delete this message?'))return;
  const r=await sb.from('crm_chat_messages').delete().eq('id',m.id);
  if(r.error)return fail(r.error);
  chatMsgs=chatMsgs.filter(x=>x.id!==m.id);onChatChange();
}
async function sendChat(c,ta,btn){

const rangeStart=r=>{const d=new Date();d.setHours(0,0,0,0);if(r==='7d')d.setDate(d.getDate()-6);if(r==='30d')d.setDate(d.getDate()-29);return d};

function secondsBy(email,from,to){
  const o={active:0,lunch:0,meeting:0,out:0};
  pres.forEach(r=>{
    if(low(r.email)!==email)return;
    const st=new Date(r.started_at).getTime();
    let en=r.ended_at?new Date(r.ended_at).getTime():to;
    en=Math.min(en,to,st+MAXSEG);

      h('button',{class:'btn ghost sm',text:'Apps',onclick:home}),
      h('button',{class:'btn ghost sm',text:'Log out',onclick:logout}))),
    h('main',{},view==='chat'?null:statusBar(),body));
}
function noAccess(){
  return h('div',{class:'center'},h('div',{class:'panel'},h('div',{class:'wm',style:'font-size:2rem'},h('b',{text:'O'}),'rchid'),h('h1',{text:'No access'}),
    h('p',{class:'sub',text:'This account is not set up for Orchid CRM. Ask the admin to add '+(me&&me.email?me.email:'your email')+' to the CRM members list.'}),
    h('button',{class:'btn primary wide',text:'Back to sign in',onclick:logout})));
}

function render(){
  const y=window.scrollY;
  $('#app').replaceChildren(ready?appView():noAccess());
  window.scrollTo(0,y);
}
let ready=false;
async function logout(){try{await sb.auth.signOut()}catch(e){}out()}

async function init(){
  $('#app').replaceChildren(h('div',{class:'center'},h('p',{class:'muted',text:'Loading…'})));
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return home();
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')out()});
  me={id:session.user.id,email:session.user.email};
  // Member management is intentionally local for now; Supabase integration will be added later.
  try{await loadAll();ready=true}catch(e){console.error(e);ready=false;return $('#app').replaceChildren(h('div',{class:'center'},h('div',{class:'panel'},h('h1',{text:'Could not load the CRM'}),h('p',{class:'sub',text:'The CRM tables may not be set up yet. Run crm_setup.sql in Supabase, then reload.'}),h('button',{class:'btn primary wide',text:'Reload',onclick:()=>location.reload()}))))}
  try{await loadPresence()}catch(e){console.error(e);presErr=true}
  try{await loadChat()}catch(e){console.error(e);chatErr=true}
  render();
  sweep();
  subChat();
  setInterval(pollChat,20000);
  setInterval(async()=>{try{await loadPresence();const a=document.activeElement;if(!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&$('#app').contains(a)))render()}catch(e){console.error(e)}},30000);
  setInterval(()=>{sweep();const a=document.activeElement;if(view!=='chat'&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&$('#app').contains(a)))render()},60000);
}
init().catch(e=>{console.error(e);home()});
})();
</script>
</body>
</html>
