<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchid · Sign in</title>
<style>
  :root { --bg:#eef1fb; --card:#fff; --ink:#14122e; --muted:#64748b; --line:#e2e8f0; --danger:#be123c; --ok:#047857; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--ink); line-height: 1.5;
    background: radial-gradient(900px 520px at 6% 0%, #cfe3ff 0, transparent 60%), radial-gradient(800px 600px at 96% 8%, #ead7ff 0, transparent 55%), radial-gradient(900px 600px at 50% 100%, #c8f1e5 0, transparent 60%), #eef1fb;
    background-attachment: fixed; }
  .center { min-height: 100%; display: grid; place-items: center; padding: 24px; }
  .panel { background: rgba(255,255,255,.8); border: 1px solid rgba(255,255,255,.9); border-radius: 28px; padding: 40px 32px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 10px 40px rgba(60,70,140,.12); }
  .wm { font-weight: 800; font-size: 2rem; letter-spacing: -.03em; display: inline-flex; align-items: baseline; justify-content: center; margin-bottom: 14px; }
  .wm b { color: #f97316; font-size: 1.8em; line-height: .7; margin-right: 1px; }
  h1 { font-size: 1.5rem; margin: 0 0 8px; }
  p.sub { color: var(--muted); margin: 0 0 22px; font-size: .95rem; }
  .field { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; font: inherit; color: var(--ink); margin-top: 10px; }
  .field:focus { outline: 2px solid #7c3aed55; border-color: #7c3aed; }
  .btn { width: 100%; margin-top: 14px; border: 0; cursor: pointer; border-radius: 999px; padding: 12px 20px; font: inherit; font-weight: 700; background: #1b1a2e; color: #fff; box-shadow: 0 8px 20px rgba(20,18,46,.25); }
  .btn:disabled { opacity: .6; cursor: default; }
  .link { background: none; border: 0; color: var(--muted); font: inherit; font-size: .9rem; margin-top: 16px; cursor: pointer; text-decoration: underline; }
  .msg { margin-top: 14px; font-size: .9rem; color: var(--danger); }
  .msg.ok { color: var(--ok); }
  .show { display: flex; gap: 6px; align-items: center; justify-content: flex-start; margin: 8px 2px 0; color: var(--muted); font-size: .85rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="center">
  <div class="panel">
    <div class="wm"><b>O</b>rchid</div>
    <div id="loading"><p class="sub">Loading…</p></div>
    <div id="form" hidden>
      <h1 id="title">Log in</h1>
      <p class="sub" id="sub">Use the email your admin added.</p>
      <input id="email" class="field" type="email" placeholder="Email" autocomplete="username" maxlength="320" aria-label="Email">
      <input id="pass" class="field" type="password" placeholder="Password" autocomplete="current-password" maxlength="200" aria-label="Password">
      <input id="pass2" class="field" type="password" placeholder="Confirm password" autocomplete="new-password" maxlength="200" aria-label="Confirm password" hidden>
      <label class="show"><input id="showpw" type="checkbox"> Show password</label>
      <button id="go" class="btn" type="button">Log in</button>
      <div id="msg" class="msg" role="alert" hidden></div>
      <button id="swap" class="link" type="button">New here? Create your password</button>
    </div>
  </div>
</div>

<script>
// ---------------------------------------------------------------
// Orchid: one sign-in for both CRMs.
// The email decides which CRM opens. Each CRM still checks its own
// database, so this list only chooses where to send people.
// ---------------------------------------------------------------
const LEGAL_USERS = [
  'herart36@gmail.com'          // opens Orchid Legal
  // '@somefirm.com'            // a whole domain also works
];
// Orchid Pals is a demo with no database, so these emails go straight to it (no password check here).
const PALS_USERS = [
  'keancarl.donato.ab@ust.edu.ph'   // opens Orchid Pals
];
// Everyone else (keandonato@404studio.click, students, etc.) opens the 404 Studio CRM.

const APPS = {
  crm:   { url: 'https://acxrobzulaswsubfoghg.supabase.co', key: 'sb_publishable_3Ehkqe8QtPVJQoh4FCZIVg_m2f8SOTD', page: 'crm.html' },
  legal: { url: 'https://djymgcwvfevvvxhhpxcj.supabase.co', key: 'sb_publishable_2ymWgVfW4kw8rBkZcetl8A_XzYwwiHa', page: 'legal.html' }
};

const $ = id => document.getElementById(id);
const matches = (list, e) => list.some(x => { x = x.toLowerCase(); return x.startsWith('@') ? e.endsWith(x) : e === x; });
const routeFor = email => {
  const e = String(email || '').trim().toLowerCase();
  if (matches(PALS_USERS, e)) return 'pals';
  return LEGAL_USERS.some(x => { x = x.toLowerCase(); return x.startsWith('@') ? e.endsWith(x) : e === x; }) ? 'legal' : 'crm';
};
const go = k => location.replace(APPS[k].page);
const goPals = email => location.replace('pals.html?email=' + encodeURIComponent(email));

let mode = 'in', clients = {};

function setMode(m) {
  mode = m;
  const up = m === 'up';
  $('title').textContent = up ? 'Create your password' : 'Log in';
  $('sub').textContent = up ? 'Use the email your admin added, then choose a password.' : 'Use the email your admin added.';
  $('pass2').hidden = !up;
  $('pass').autocomplete = up ? 'new-password' : 'current-password';
  $('go').textContent = up ? 'Create account' : 'Log in';
  $('swap').textContent = up ? 'Already have a password? Log in' : 'New here? Create your password';
  say('');
}
function say(text, ok) { const m = $('msg'); m.textContent = text; m.className = 'msg' + (ok ? ' ok' : ''); m.hidden = !text; }

async function submit() {
  const email = $('email').value.trim(), pass = $('pass').value;
  say('');
  if (routeFor(email) === 'pals') return goPals(email);
  if (!email || !pass) return say('Enter your email and password.');
  if (mode === 'up' && pass !== $('pass2').value) return say('The two passwords do not match.');
  const k = routeFor(email), c = clients[k];
  $('go').disabled = true;
  try {
    if (mode === 'up') {
      const { data, error } = await c.auth.signUp({ email, password: pass, options: { emailRedirectTo: location.origin + location.pathname } });
      if (error) return say(error.message);
      if (data.session) return go(k);
      setMode('in'); return say('Check your email and tap the confirmation link, then log in here.', true);
    }
    const { error } = await c.auth.signInWithPassword({ email, password: pass });
    if (error) return say(error.message === 'Invalid login credentials' ? 'Wrong email or password. If you just signed up, confirm your email first.' : error.message);
    go(k);
  } catch (e) { say(e.message || 'Something went wrong. Please try again.'); }
  finally { $('go').disabled = false; }
}

async function boot() {
  await new Promise((resolve, reject) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';
    sc.onload = resolve; sc.onerror = () => reject(new Error('Could not load the sign-in service. Check your connection and refresh.'));
    document.head.appendChild(sc);
  });
  // Create both clients in the same tick so an email-confirmation link (token in the URL) is read by each.
  for (const k of Object.keys(APPS)) clients[k] = window.supabase.createClient(APPS[k].url, APPS[k].key);
  // Already signed in? Send them to the right CRM.
  for (const k of Object.keys(APPS)) {
    const { data: { session } } = await clients[k].auth.getSession();
    if (!session) continue;
    if (routeFor(session.user.email) === k) return go(k);
    await clients[k].auth.signOut({ scope: 'local' });   // leftover session for the wrong CRM
  }
  $('loading').hidden = true; $('form').hidden = false; $('email').focus();
}

function palsCheck() {
  const pals = routeFor($('email').value) === 'pals';
  ['pass', 'pass2'].forEach(id => { $(id).hidden = pals || (id === 'pass2' && mode !== 'up'); });
  document.querySelector('.show').hidden = pals;
  $('go').textContent = pals ? 'Continue to Orchid Pals' : (mode === 'up' ? 'Create account' : 'Log in');
}
$('email').addEventListener('input', palsCheck);
$('go').addEventListener('click', submit);
$('swap').addEventListener('click', () => { setMode(mode === 'in' ? 'up' : 'in'); palsCheck(); });
$('showpw').addEventListener('change', e => { const t = e.target.checked ? 'text' : 'password'; $('pass').type = t; $('pass2').type = t; });
['email', 'pass', 'pass2'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') submit(); }));
boot().catch(e => { $('loading').hidden = true; $('form').hidden = false; say(e.message || 'Something went wrong.'); });
</script>
</body>
</html>
