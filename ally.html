      try{localStorage.setItem(K+'_backup',JSON.stringify(S))}catch(e){}   // safety copy before taking the cloud version

      Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,DEF(),rd,keep);delete S._dirty;
      try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
